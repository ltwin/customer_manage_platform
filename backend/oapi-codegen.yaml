# oapi-codegen 配置：Go 服务端按 tag 过滤只生成已实现域（design D4）。
# 后续域 feature 落地时把对应 tag 加进 include-tags。
package: httpapi
output: internal/platform/httpapi/api.gen.go
generate:
  models: true
  gin-server: true
output-options:
  # nullable-type: PATCH null 三态（未传/传值/传 null）由生成类型直接表达（design D9）。
  nullable-type: true
  include-tags:
    - auth
    - customer-core
    - customer-profile-complete
    - customer-avatar
    - packages
    - orders
    - schedule
    - reminder-engine
