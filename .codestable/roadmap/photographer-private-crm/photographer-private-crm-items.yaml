    depends_on: []
    status: done
    feature: 2026-07-06-platform-skeleton
    minimal_loop: false
    notes: greenfield 安全网条目；完成信号：make check 全绿、登录取 token 后 GET /api/v1/me 返回账号、跨账号过滤有基座级测试、OpenAPI 与 §4 一致且 codegen 可跑；代码组织 Gin+轻量 DDD（roadmap §4 头注）；外部依赖前置：TG bot 申请 + sendMessage 冒烟（脚本级），token 凭证规则落 attention.md；拍板包已全部落定（2026-07-05）：Go+Gin+React+PostgreSQL+OpenAPI-first、阿里云 ECS 自部署

  - slug: customer-core
    description: 30 秒建档最小闭环：建客户（昵称+至少 1 个社交身份+渠道必填，建档时可录入多个身份）、列表搜索、详情页
    depends_on: [platform-skeleton]
    status: done
    feature: 2026-07-07-customer-core
    minimal_loop: true
    notes: 完成信号：新建到保存 ≤30 秒计时演示（覆盖 2 个社交身份输入）；POST /customers 接收 identities[1..N]，至少 1 个社交身份是硬性条件，identities 为空返回 400 validation_failed，不允许生成无身份客户；同事务写入客户与全部社交身份；列表按 q/channel 过滤用例通过（q 匹配含 phone，2026-07-06 契约更新）；列表/详情聚合字段（orders_count/last_shot_at/stats）按 §4.3 下发，order 域未落地前恒 0/null；启动时收编 OpenAPI 契约增量与 GET /me 白名单（roadmap §7 观察项）

  - slug: customer-profile-complete
    description: 档案补全：建档后社交身份增删、客户合并、归档、生日/手机/真名渐进字段、随手备注、转介绍关联
    depends_on: [customer-core]
    status: done
    feature: 2026-07-07-customer-profile-complete
    minimal_loop: false
    notes: merge/归档语义按 roadmap 4.2；design 阶段按 merge、归档、notes、referral、渐进字段分片验收；落地后评估 req customer-profile draft→current；含客户的页面 ≤2 步追加备注

  - slug: customer-avatar
    description: 客户头像：可选设置/替换/移除头像；列表、详情、转介绍下拉、merge 对话框等客户选择面显示头像缩略图，未设置时使用默认首字头像
    depends_on: [customer-profile-complete, order-tracking, schedule-calendar]
    status: done
    feature: 2026-07-11-customer-avatar
    minimal_loop: false
    notes: 依赖理由：头像属于客户档案增强；订单/档期客户选择面带头像是本条硬范围，故显式依赖已完成的 order-tracking/schedule-calendar，本条承担其 UI 兼容增量且不回退 done 状态。2026-07-11 owner 拍板首版 ECS/local persistent volume，经 AvatarObjectStore 隔离并预留 OSS adapter；2026-07-13 owner 拍板 merged 禁止PUT但允许cleanup-only DELETE，并接受24h grace、每小时、每账号每tick各1页inventory/audit+100 due的GC默认值。完成信号：avatar_revision If-Match PUT/DELETE、强内容版本 GET、安全/非法输入/merged cleanup通过，不可复用 object_id generation+PG revision/五字段 pointer 在结果未知/ABA/并发下正确，进入GC的代次不再晋升且精确旧 generation Delete 在 DB/session 丢失与同checksum重发下不伤新current，pending due不被重复扫描推迟，signal-aware MaintenanceRunner/reconciliation可回收并报告integrity，全部展示/选择/固定摘要有头像或fallback，production require-mount缺卷失败、volume recreate/停app备份恢复+exact-generation manifest可核对，make check全绿；不实现OSS adapter/搬迁/预签名

  - slug: package-catalog
    description: 套系 CRUD、上下架与删除：拍摄类型/定价方式/张数时长底片精修参数；下架后不出现在选择列表，删除受引用完整性保护
    depends_on: [platform-skeleton]
    status: done
    feature: 2026-07-08-package-catalog
    minimal_loop: false
    notes: 商品心智（2026-07-08 owner 拍板，§4.2/§4.3 update）——active=上架、archived=下架、DELETE=删除；完成信号：按 Package shape 建/改/下架/上架用例通过；?status=active 过滤正确；DELETE 无引用套系 204、被引用套系 409 package_in_use（order 域未落地前删除恒放行，真实 409 由 order-tracking 接通）

  - slug: order-tracking
    description: 订单记录：创建（客户+套系）、八态状态机（非法跃迁 409、shot_at/delivered_at 自动写入、未结清禁 closed）、定金/尾款标记、按客户/全局/未收尾款查询
    depends_on: [customer-core, package-catalog]
    status: done
    feature: 2026-07-08-order-tracking
    minimal_loop: false
    notes: 依赖理由：订单挂 Customer、引用 Package；完成信号：跃迁矩阵测试全过（含时间戳自动写入、409 unpaid_balance）、unpaid_balance 筛选正确、merge 迁移订单用例、引用归档客户 409 customer_archived；落地时接通 customers/packages 聚合字段真实计算（orders_count/last_shot_at/total_order_amount，2026-07-06 契约更新）；接通套系删除 in-use 校验（删除被订单引用的套系返回 409 package_in_use，§4.3 契约随域生长，2026-07-08 update，package-catalog 已留领域方法查引用数、order 域接通真实订单表）

  - slug: schedule-calendar
    description: 档期：月历、跨日/全天 slot CRUD、客户与订单关联、可行动重叠提示、独立忙碌块与异常恢复
    depends_on: [order-tracking]
    status: done
    feature: 2026-07-09-schedule-calendar
    minimal_loop: false
    notes: 依赖理由：type=shoot 的 slot 必须挂订单；本条增量 owner 覆盖 platform+order+schedule+webapp。完成信号：月历与客户档案共用「新建拍摄档期」流程；月历查指定日期/重叠≤10秒、客户档案建单+挂档≤30秒；周一首列的固定6周网格内跨日/全天按相交自然日显示，密集日按display_start/id稳定排序且冲突数按当日参与重叠的唯一slot计；保存前展示重叠，成功后刷新确认；组合流程用128-bit flow_id的per-step attempt Idempotency-Key+session journal，服务端operation固定order.create.v1/schedule-slot.create.v1，重复点击/响应丢失/5xx/硬刷新不重复写，24小时过期禁自动重放；历史无候选跳转backfill时，schedule_draft只允许历史可排期六态，默认shot并按账号时区预填档期开始日，POST order先进入backfill_order pending phase，结果未知不重复补录；只有unknown结果持续阻塞且不可清理，明确失败/资源已知可保留现状或补偿后结束；路径A先新建consulting，所有consulting均先成功建slot并刷新日历，以刷新后ScheduleSlotListItem.customer_id修正journal再同步scheduled，status_sync unknown保留恢复入口，明确失败可重试/删slot/保留异常现状并结束；shoot写与归档/merge共用customer→order锁序并按先提交者线性化，无死锁/悬空引用，customer_changed保留表单/已知订单并清旧候选后重拉确认；POST orders用creation_mode区分新业务/补录，GET orders用schedulable_at复用订单+客户未来/历史矩阵，未来服务端要求active客户、历史允许active/archived、merged永拒；GET /me timezone驱动日界并覆盖schedule_draft OrderWorkspace历史时间/DST，加载失败不回退浏览器时区且禁写入；ScheduleSlotListItem为type判别union，shoot必返order/customer/status摘要并可直达客户档案订单tab，客户归档/订单取消后仍显示文本警示；order_in_use/order_already_scheduled typed details可直达slot；无header/creation_mode/schedulable_at的既有新业务调用与列表排序/total回归不变；首版仅月视图，移动端只保证查档期，不做周视图/拖拽/周期重复；无组合端点。

  - slug: reminder-engine
    description: 提醒引擎：/admin/reminders/scan 幂等生成生日/回访/流失三类提醒、done/dismiss、参数可配置（按拍摄类型流失阈值、账号时区）
    depends_on: [customer-profile-complete, order-tracking]
    status: planned
    feature: null
    minimal_loop: false
    notes: 依赖理由：生日规则要 birthday 字段（customer-profile-complete）、回访/流失要订单状态时间戳（order-tracking）；硬验收：同日双跑扫描零新增、时区日界用例、时间戳缺失跳过、零成交不告警、merge 迁移提醒用例；GET /reminders 支持 customer_id 过滤（2026-07-06 契约更新，客户档案提醒 tab 数据源）

  - slug: telegram-digest
    description: TG Bot：bind-token 绑定流程、每日摘要推送、/today 命令、失败重试与日志
    depends_on: [reminder-engine, schedule-calendar]
    status: planned
    feature: null
    minimal_loop: false
    notes: 依赖理由：摘要 = 提醒 + 当日档期；bot token 已在 platform-skeleton 冒烟验证；完成信号：真机收到含真实数据摘要（截图）、未绑定时系统正常

