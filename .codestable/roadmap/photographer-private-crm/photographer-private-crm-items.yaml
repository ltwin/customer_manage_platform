    description: 首页面板：待办提醒（近 3 天窗口）、今日档期、待收尾款、流失预警、近 30 天概览（roadmap 4.3 dashboard 契约，2026-07-06 口径更新）
    depends_on: [order-tracking, schedule-calendar, reminder-engine]
    status: planned
    feature: null
    minimal_loop: false
    notes: 完成信号：五卡片与各域列表交叉一致核对用例；登录后默认落地页

  - slug: data-export
    description: 全量 JSON 导出（roadmap 4.6 契约）：一键导出全部实体 + counts 核对
    depends_on: [customer-profile-complete, customer-avatar, package-catalog, order-tracking, schedule-calendar, reminder-engine]
    status: planned
    feature: null
    minimal_loop: false
    notes: 依赖理由：导出范围 = 4.2 全部实体，各域落地后才有内容可导；design 启动 gate：owner 必须先拍板 reference-only JSON（明确不承诺头像便携恢复），或先 update roadmap §4.6 为媒体文件+exact-generation manifest/key/count/checksum 的便携包，未决不得进入 design/标 done；选定后完成信号含 counts/manifest 自动化核对与 PII 保管说明

