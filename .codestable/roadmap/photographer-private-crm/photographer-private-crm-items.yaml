items:
  - slug: platform-skeleton
    description: Go+React 脚手架、单账号登录、账号上下文与 repository 基座（强制账号过滤）、错误封套、健康检查、build/test/lint 命令基线、§4 契约固化为 OpenAPI + 双端 codegen
    depends_on: []
    status: done
    feature: 2026-07-06-platform-skeleton
    minimal_loop: false
    notes: greenfield 安全网条目；完成信号：make check 全绿、登录取 token 后 GET /api/v1/me 返回账号、跨账号过滤有基座级测试、OpenAPI 与 §4 一致且 codegen 可跑；代码组织 Gin+轻量 DDD（roadmap §4 头注）；外部依赖前置：TG bot 申请 + sendMessage 冒烟（脚本级），token 凭证规则落 attention.md；拍板包已全部落定（2026-07-05）：Go+Gin+React+PostgreSQL+OpenAPI-first、阿里云 ECS 自部署

  - slug: customer-core
    description: 30 秒建档最小闭环：建客户（昵称+至少 1 个社交身份+渠道必填，建档时可录入多个身份）、列表搜索、详情页
    depends_on: [platform-skeleton]
    status: done
    feature: 2026-07-07-customer-core
    minimal_loop: true
    notes: 完成信号：新建到保存 ≤30 秒计时演示（覆盖 2 个社交身份输入）；POST /customers 接收 identities[1..N]，至少 1 个社交身份是硬性条件，identities 为空返回 400 validation_failed，不允许生成无身份客户；同事务写入客户与全部社交身份；列表按 q/channel 过滤用例通过（q 匹配含 phone，2026-07-06 契约更新）；列表/详情聚合字段（orders_count/last_shot_at/stats）按 §4.3 下发，order 域未落地前恒 0/null；启动时收编 OpenAPI 契约增量与 GET /me 白名单（roadmap §7 观察项）

  - slug: customer-profile-complete
    description: 档案补全：建档后社交身份增删、客户合并、归档、生日/手机/真名渐进字段、随手备注、转介绍关联
    depends_on: [customer-core]
    status: done
    feature: 2026-07-07-customer-profile-complete
    minimal_loop: false
    notes: merge/归档语义按 roadmap 4.2；design 阶段按 merge、归档、notes、referral、渐进字段分片验收；落地后评估 req customer-profile draft→current；含客户的页面 ≤2 步追加备注

  - slug: customer-avatar
    description: 客户头像：可选设置/替换/移除头像；列表、详情、转介绍下拉、merge 对话框等客户选择面显示头像缩略图，未设置时使用默认首字头像
    depends_on: [customer-profile-complete]
    status: planned
    feature: null
    minimal_loop: false
    notes: 依赖理由：头像属于客户档案补全后的展示增强，不阻塞 30 秒建档；完成信号：头像字段/API 与前端选择组件联动，上传/替换/移除用例通过，未设置头像 fallback 稳定；不强制客户必须设置头像

  - slug: package-catalog
    description: 套系 CRUD、上下架与删除：拍摄类型/定价方式/张数时长底片精修参数；下架后不出现在选择列表，删除受引用完整性保护
    depends_on: [platform-skeleton]
    status: done
    feature: 2026-07-08-package-catalog
    minimal_loop: false
    notes: 商品心智（2026-07-08 owner 拍板，§4.2/§4.3 update）——active=上架、archived=下架、DELETE=删除；完成信号：按 Package shape 建/改/下架/上架用例通过；?status=active 过滤正确；DELETE 无引用套系 204、被引用套系 409 package_in_use（order 域未落地前删除恒放行，真实 409 由 order-tracking 接通）

  - slug: order-tracking
    description: 订单记录：创建（客户+套系）、八态状态机（非法跃迁 409、shot_at/delivered_at 自动写入、未结清禁 closed）、定金/尾款标记、按客户/全局/未收尾款查询
    depends_on: [customer-core, package-catalog]
    status: done
    feature: 2026-07-08-order-tracking
    minimal_loop: false
    notes: 依赖理由：订单挂 Customer、引用 Package；完成信号：跃迁矩阵测试全过（含时间戳自动写入、409 unpaid_balance）、unpaid_balance 筛选正确、merge 迁移订单用例、引用归档客户 409 customer_archived；落地时接通 customers/packages 聚合字段真实计算（orders_count/last_shot_at/total_order_amount，2026-07-06 契约更新）；接通套系删除 in-use 校验（删除被订单引用的套系返回 409 package_in_use，§4.3 契约随域生长，2026-07-08 update，package-catalog 已留领域方法查引用数、order 域接通真实订单表）

  - slug: schedule-calendar
    description: 档期：月/周日历、slot CRUD、订单关联、重叠返回 overlaps 提示、独立忙碌块
    depends_on: [order-tracking]
    status: planned
    feature: null
    minimal_loop: false
    notes: 依赖理由：type=shoot 的 slot 必须挂订单；完成信号：overlaps 用例通过、建/删 slot 不改订单状态（反向联动禁止用例）、日历答复某天占用 ≤10 秒演示；组合流程拍板（2026-07-06）：前端「新建拍摄档期」弹窗（含客户档案页新约单入口）隐式先 POST /orders 再 POST /schedule/slots 挂 order_id，不新增组合端点——design 硬约束；design 必答：①两步失败处理（订单已建、slot 失败的提示与补救，注意悬挂 consulting 订单会抑制该客户 churn 预警）②保存成功后是否隐式第三步 PATCH /orders {status:scheduled} 还是接受日历有 shoot slot 的 consulting 订单常态

  - slug: reminder-engine
    description: 提醒引擎：/admin/reminders/scan 幂等生成生日/回访/流失三类提醒、done/dismiss、参数可配置（按拍摄类型流失阈值、账号时区）
    depends_on: [customer-profile-complete, order-tracking]
    status: planned
    feature: null
    minimal_loop: false
    notes: 依赖理由：生日规则要 birthday 字段（customer-profile-complete）、回访/流失要订单状态时间戳（order-tracking）；硬验收：同日双跑扫描零新增、时区日界用例、时间戳缺失跳过、零成交不告警、merge 迁移提醒用例；GET /reminders 支持 customer_id 过滤（2026-07-06 契约更新，客户档案提醒 tab 数据源）

  - slug: telegram-digest
    description: TG Bot：bind-token 绑定流程、每日摘要推送、/today 命令、失败重试与日志
    depends_on: [reminder-engine, schedule-calendar]
    status: planned
