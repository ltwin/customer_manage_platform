roadmap: self-service-account-system
created: 2026-07-30

items:
  - slug: email-account-access
    description: 交付邮箱注册验证、access/refresh 会话与 Web 接入，并让现有 seed 账号保留原 account_id 完成一次性邮箱认领
    depends_on: []
    status: in-progress
    feature: 2026-07-30-email-account-access
    minimal_loop: true
    notes: >-
      粗粒度全栈闭环；Schema、邮件 adapter、OpenAPI/codegen、后端、前端、迁移与测试不得按技术层再拆成独立 feature。
      内部以 schema/migration、auth 深模块、mail/OpenAPI/HTTP、webapp 全请求路径、legacy preflight、E2E/隔离六个 checklist waves 推进。
      可独立验收为测试/封闭环境中间闭环，但 AUTH_PUBLIC_REGISTRATION_ENABLED 默认 false，production preflight 必须以
      public-auth-hardening-not-complete 拒绝在本条完成后开启生产公开注册。false 时 capabilities/register 与 WelcomePage/register route
      必须统一 fail closed，任意 register body 固定 503 registration_disabled 且无账号、token、limiter 或 mail 副作用；已有账号入口继续可用。
      auth-ops 在本条同时交付全新零账号部署的首账号 bootstrap 命令：复用 Register 应用入口与验证邮件，可信 CLI 不受公开注册开关与公开 limiter 约束。

  - slug: public-auth-hardening
    description: 在邮箱账号访问闭环上补齐密码恢复修改、全 refresh session 撤销、持久化限速防枚举与公开上线安全回归
    depends_on: [email-account-access]
    status: in-progress
    feature: 2026-07-30-public-auth-hardening
    minimal_loop: false
    notes: >-
      依赖第一条的 identity、action token、refresh family、邮件 port 与前端 AuthState；找回、限速、认证事件监控和安全测试保持为一个公开上线闭环。
      只有本条完成全部 secure config、mail、rate-limit、cutover、monitor 与安全回归验收后，production preflight 才允许公开注册开关为 true；
      实际部署和生产 cutover 仍需 owner 单独授权。
