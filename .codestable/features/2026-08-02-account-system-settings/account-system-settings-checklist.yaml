feature: 2026-08-02-account-system-settings
created: 2026-08-02

dod:
  commands:
    - id: CMD-001
      command: "rg -q 'test:account-center' Makefile && cd frontend && npm run test:account-center && npm run test:settings && npm run build && npm run lint"
      core: true
      failure_handling: fix-or-block
      notes: "扩展 test:account-center（section ownership + reducer/body builder + A5c stub double + A11 源码正则）；test:settings 守卫旧页；Makefile 机械断言防漏挂。"
    - id: CMD-002
      command: "cd backend && go test ./internal/settings/... -count=1 -parallel=1"
      core: false
      failure_handling: fix-or-block
      notes: "本条预期无后端语义变更；误触必须零漂移。"
    - id: CMD-003
      command: "make check"
      core: false
      failure_handling: defer-to-hardening
  evidence_required:
    - command_output
    - browser_screenshot
    - request_body_capture
    - reducer_unit_assertions
    - accessibility_assertions
    - diff_summary
  cleanliness:
    debug_output: forbidden
    temporary_todo: forbidden
    save_all_semantics_on_account_settings: forbidden
    new_settings_endpoint: forbidden
    telegram_token_in_storage_or_logs: forbidden
    second_theme_store: forbidden
    delete_legacy_settings_page: forbidden
    parallel_settings_patch_without_queue: forbidden

steps:
  - id: STEP-000
    action: "分支门禁：离开受保护 main 或落盘 owner 检出授权"
    exit_signal: "可开发分支已确认？"
    status: done
  - id: STEP-000b
    action: "前置门禁：/account/settings 可达；AccountCenterContext.theme/setTheme 可消费；retryTimezone+notify 在该路由下可消费（layout 转发 ShellContext 或等价）"
    exit_signal: "三项 seam 均可？否则 blocked（归属前置，不静默改 §4.5）"
    status: done
  - id: STEP-001
    action: "settingsControllerKernel + settingsSaveQueue + 五区 body builder scaffold"
    exit_signal: "reducer 可单测？queue 串行可观察？"
    status: done
  - id: STEP-002
    action: "挂入 /account/settings 五区 UI；退役保存全部；保留旧 /settings 组件"
    exit_signal: "新页可加载；旧页未删？"
    status: done
  - id: STEP-003
    action: "实现常规／可约／提醒／Telegram／外观；churn 完整三类型；theme 经 AccountCenterContext"
    exit_signal: "A1–A4/A7/A8 通过？"
    status: done
  - id: STEP-004
    action: "dirty/stale/server-updated/失败隔离/queue 乱序矩阵 + timezone 刷新"
    exit_signal: "A5/A5b/A5c/A6 通过？"
    status: done
  - id: STEP-005
    action: "扩展 test:account-center + Makefile；旧 test:settings；a11y 最小；范围 diff"
    exit_signal: "CMD-001 绿；A9–A11 通过？"
    status: done

