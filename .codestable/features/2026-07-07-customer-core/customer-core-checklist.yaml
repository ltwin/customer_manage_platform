feature: 2026-07-07-customer-core
created: 2026-07-07

steps:
  - action: "契约同步：收编 roadmap §7 点名的全部 OpenAPI 漂移（客户/套系聚合字段、q 匹配 phone、reminders customer_id、Package.note、SocialPlatform 枚举、dashboard 近 3 天/近 30 天口径、POST /customers referral 404）并给 create/list/detail 三个操作增加后端 codegen 可选标签；未实现域只同步契约不注册路由"
    exit_signal: "`make generate && git diff --exit-code -- backend/internal/platform/httpapi/api.gen.go frontend/src/api/schema.d.ts` 退出码 0，且 Go server interface 只新增 create/list/detail 三个 customer-core 操作；未实现档案补全/其他业务域端点仍不注册"
    status: done
  - action: "AccountScope 扩展：按 fail-loud 约束增加 tx-aware scope 与客户列表所需的受控复杂读模型能力，覆盖同事务写入 1..N 个身份、返回插入 id、count、身份 handle 搜索和 referrer 可见性，不接受请求派生 SQL 片段"
    exit_signal: "测试证明 Customer+1..N SocialIdentity 同事务提交/回滚；双账号测试证明列表、count、详情、referrer 查验均只看当前账号；非法查询片段被拒绝"
    status: done
  - action: "客户域持久化：新增 customers/social_identities schema、客户实体校验、创建客户+1..N 个社交身份事务、列表和详情读模型"
    exit_signal: "service/repository 测试覆盖创建成功（至少 2 个身份）、校验失败回滚、referral 可见/缺失/跨账号、q/channel/status/page 查询、聚合零值 shape"
    status: done
  - action: "HTTP 垂直切片：注册受保护 POST /customers、GET /customers、GET /customers/{id}，接入 ErrorEnvelope、AccountContext 和 customer service"
    exit_signal: "API 集成测试覆盖 201/200/400/401/404 路径；patch/identities/notes/merge 仍返回 404"
    status: done
  - action: "前端静态结构：新增 /customers、/customers/new、/customers/:id 受保护页面骨架，包含列表筛选、新建表单、详情基础信息区和空态"
    exit_signal: "浏览器在无真实数据或占位数据下能看到三页完整布局；长昵称/handle 不撑破主要容器"
    status: done
  - action: "前端状态接入：接通 API client、列表筛选、创建保存、成功跳详情、错误提示、401 回登录，并保留表单输入"
    exit_signal: "浏览器计时演示：登录后 30 秒内完成含 2 个社交身份的建档并在列表/详情可查；API 错误和未认证路径可见"
    status: done
  - action: "harden 与终验：补 UI polish（loading/error/empty/disabled/small screen/focus/keyboard/contrast）、范围守护、清洁度清扫和命令终验"
    exit_signal: "`make check` 退出码 0；A11/A12 截图或录屏归档；范围守护和清洁度 grep/diff review 通过"
    status: done

