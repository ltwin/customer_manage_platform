    exit_signal: "三规则正/反/边界矩阵（含 02-29、跨年、时区/DST 注入、缺时间戳跳过、零成交、merged/archived 排除、已删订单与复购 auto-dismiss）单测通过；同日双跑 created=0"
    status: done
  - action: "reminder API 面：list（过滤/分页/稳定排序）、create custom、done/dismiss handler"
    exit_signal: "契约用例通过：过滤组合正确、跨账号 404、done/dismiss 幂等 200、custom dedup_key=custom:{id}"
    status: done
  - action: "每日调度：ReminderScanRunner（小时 tick + 检查点 + single-flight）+ cmd/server 装配并入 serverLifecycle"
    exit_signal: "注入 clock 单测证明同本地日恰一次、跨日触发、重启补扫；SIGTERM 有界退出用例通过"
    status: done
  - action: "customer merge 增量：merge 事务内 reminders 改挂 target"
    exit_signal: "merge 用例通过：source 全部提醒（含 pending/done）改挂 target，事务原子"
    status: done
  - action: "前端垂直切片：客户档案提醒 tab 接真实数据（计数/列表/done/dismiss/新增 custom）、全局提醒页（筛选+操作+手动扫描）、设置页（参数+时区编辑校验）；空/加载/错误态收尾"
    exit_signal: "三条浏览器路径逐条截图通过；make check 全绿；生成物零漂移"
    status: done

