feature: 2026-07-06-platform-skeleton
created: 2026-07-06

steps:
  - action: "工程骨架与命令基线：backend Go module + frontend Vite/React/TS 脚手架 + 根级 Makefile（check/build/lint/test/generate/db-up）+ .golangci.yml（按 compound go-uber-style-guide，含 depguard 依赖方向断言：domain/service 禁 gin、pgx 仅 store 系包）+ docker-compose.yml 的 postgres 服务（make db-up 起本地 dev 库）+ .env.example"
    exit_signal: "空骨架上 `make check` 退出码 0（build+lint+test 全绿）；`make db-up` 起出可连接的本地 PG"
    status: done
  - action: "契约固化与双端 codegen：api/openapi.yaml 忠实转写 §4 全部 HTTP 端点（§4.1 login + §4.3 各域清单 + §4.6 export）∪ 白名单 {GET /me}；oapi-codegen 按 tag（本条仅 auth tag，login 与 me 同挂）生成 Go 服务端类型；openapi-typescript 生成 TS 全量类型；漂移检查进 make check"
    exit_signal: "`make generate && git diff --exit-code` 干净且双端编译通过；openapi.yaml 端点集合与 §4.1+§4.3+§4.6 ∪ {GET /me} 双向核对无差集"
    status: done
  - action: "数据库迁移与默认账号 seed：golang-migrate 接入、0001 accounts 表、启动时 ensure 默认账号（读 SEED_ADMIN_PASSWORD，幂等；空库缺该变量则 fail-fast）、测试用一次性 PG 容器基建"
    exit_signal: "测试绿三分支：空库 migrate up 成功；连续启动两次后 accounts 有且仅有 1 条默认账号；空库且缺 SEED_ADMIN_PASSWORD 时启动失败并输出明确错误"
    status: done
  - action: "AccountScope 隔离基座：scope 只能由 AccountContext 构造、业务表查询强制 account_id 过滤、测试专用探针表（含 account_id 外键，经同一迁移机制建于测试库，不进生产迁移序列）+ 双账号交叉读写基座级测试"
    exit_signal: "双账号隔离测试绿：A 写入探针表的数据经 B 的 scope 查询不可见，反向同理"
    status: done
  - action: "HTTP 编排骨架与错误封套：Gin server、中间件链（recovery→请求日志→封套→auth 豁免表）、/healthz（DB ping，失败 503）、未注册 API 路径与方法不匹配一律 404、panic 封套化"
    exit_signal: "集成测试绿：healthz 200 无鉴权且 DB 不可达时 503（单测注入）；未注册 API 路径与方法不匹配均 404 not_found 封套；handler panic 返回 500 internal 封套且进程存活"
    status: done
  - action: "登录与账号上下文：bcrypt 校验、JWT 签发/解析、auth 中间件注入 AccountContext、GET /me（不含 password_hash）；handler 薄层约束落地"
    exit_signal: "集成测试绿：登录→token→/me 往返 200；错密码/缺 password/无 token/篡改 token/过期 token 各返回对应封套；depguard 断言 domain/service 层无 gin import 且 lint 通过"
    status: done
  - action: "前端垂直切片（dev 走 Vite dev server proxy /api）：登录页（空态/加载/错误态）、token 存储、守卫路由骨架（/login + 受保护根路由）、/me 账号信息展示、生成 TS 类型 + 封套错误处理接入 API client"
    exit_signal: "浏览器手工路径截图齐三段：错密码有提示、正确登录进入看到账号信息、未登录访问受保护路由跳回登录页"
    status: done
  - action: "TG 冒烟：scripts/telegram-smoke.sh（env 注入 TELEGRAM_BOT_TOKEN，getUpdates 取 chat_id 后 sendMessage）；仅依赖 owner 前置动作（BotFather 建 bot + 给 bot 发一条消息），失败不阻塞后续步骤"
    exit_signal: "owner 真机收到测试消息（截图归档 feature 目录）"
    status: pending
  - action: "部署工件双轨：多阶段 Dockerfile（前端构建产物经 go:embed 打进二进制）+ compose app 服务接线（含 healthz healthcheck 使 --wait 就绪语义成立；凭证一律经 env_file 注入不硬编码）+ 非 API 路径 SPA fallback；支持三形态——二进制直跑接现有 PG / 二进制 + compose PG / 全容器。前置：cp .env.example .env（占位值即本地可跑 dev 值）"
    exit_signal: "CMD-007 docker build 成功；CMD-008 compose 全容器模式 healthz 200；二进制直跑访问 / 返回登录页（go:embed 生效，截图）"
    status: done
  - action: "harden 收尾与终验：凭证反查（CMD-005/006）、.env.example 对照挂载点表 env key 清单核对完整、清洁度清扫（无调试输出/TODO/注释代码/死 import）、README 开发段（起服务双轨/环境变量/备份建议/token 轮换/seed 后可移除变量与改密现状）、make check 终验"
    exit_signal: "CMD-005 与 CMD-006 通过；.env.example 覆盖全部 env key；README 开发段落盘；`make check` 终验退出码 0"
    status: done

