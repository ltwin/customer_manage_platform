dod:
  commands:
    - id: CMD-001
      command: "make check"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "make generate && git diff --exit-code"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "make migrate-up"
      core: false
      failure_handling: fix-or-block
    - id: CMD-004
      command: "bash scripts/telegram-smoke.sh"
      core: true
      failure_handling: fix-or-block
    - id: CMD-005
      command: "! git grep -nE '[0-9]{6,}:[A-Za-z0-9_-]{30,}' -- ':!.codestable'"
      core: false
      failure_handling: fix-or-block
    - id: CMD-006
      command: "git check-ignore -q .env && ! git ls-files --error-unmatch .env 2>/dev/null"
      core: false
      failure_handling: fix-or-block
    - id: CMD-007
      command: "docker build -t crm:local ."
      core: true
      failure_handling: fix-or-block
    - id: CMD-008
      command: "docker compose up -d --wait && curl -fsS http://localhost:8080/healthz; rc=$?; docker compose down; exit $rc"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, screenshots, diff_summary]
  cleanliness:
    debug_output: forbidden
    exceptions: "slog 结构化请求日志与错误日志是功能本身"
    todo_fixme: forbidden-unless-tracked
    commented_out_code: forbidden
    unused_imports: forbidden
