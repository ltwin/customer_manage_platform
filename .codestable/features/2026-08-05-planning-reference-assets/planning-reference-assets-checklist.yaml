checks:
  - item: "source_class、rights_basis、purpose、target closed union 与 matrix_version=1 完整；client permitted_uses 不能进入 request 或放宽服务端裁决"
    source: "design §2.1 rights matrix、A2-A3"
    status: pending
  - item: "PlanAsset/generation/rendition/rights immutable identity 与 asset revision 分离；original/display checksum、size、mime、dimension 可审计且 object key 不外露"
    source: "design D2、§2.1 model、A1/A10"
    status: pending
  - item: "JPEG/PNG/static WebP、20MiB/12000/60MP/2560 与 metadata stripping 的待确认假设被实现为同一 versioned pipeline/contract"
    source: "design A-IMG-1、§1.4、A4"
    status: pending
  - item: "upload 只有一份 operation/resource/canonical body/stored response；display 是 versioned 派生输出，不存在 preflight/final 双 claim；同 key same/different bytes/rights/plan、concurrent replay、claim crash 与 response-loss 行为确定"
    source: "design D9、§2.1 canonical contract、A5"
    status: pending
  - item: "object/DB 事务边界不宣称 exactly-once；original/display/DB/ledger 每个故障点由 immutable resume 或 orphan reconciliation 收口"
    source: "design D10、§2.2 upload、A6"
    status: pending
  - item: "HolderProof 在同一 TxAccountScope 验证 plan/Shot ownership、lifecycle 与 revision；planningmedia 不查询 core/customer/order/schedule 表"
    source: "design D1、HolderProof ports、A7"
    status: pending
  - item: "binding/lease/permit 四层逐次重检 exact generation/rights/purpose；business AssetLease 必须有 binding，AssetReadPin 以 binding/upload context 二选一锚定；detach 不等于 delete，lease/pin 不等于授权"
    source: "design D3-D7、§2.2 chain、A8-A10"
    status: pending
  - item: "48h staged/orphan rule、binding/permit/GC 共用 asset row lock、exact claim/delete/finalize、bound/staged read pin 与 late-delete 防护有固定时钟和双连接 fixture"
    source: "design A-IMG-2、D11、A9"
    status: pending
  - item: "immutablefs 无领域语义；avatar typed store/pointer/inventory/manifest/backup lifecycle 未并入 planningmedia 或通用 BlobStore"
    source: "design D12、§2.5、A12"
    status: pending
  - item: "gallery 与 RunInputSnapshot 使用普通/TxAccountScope 同源 batch projector；首次 refs 进入 stored response，replay query 为 0；Web/Run Mode 只读 display且失败不阻断现场执行"
    source: "design D7-D8、§2.2 frontend、A10-A14"
    status: pending
  - item: "module inventory/adapter restore fixture 精确且全成全败；production schema-v2 package/rehearsal 明确保留给 hardening"
    source: "design §2.2 restore、§3.2、A12"
    status: pending
  - item: "ingestion prepared port 不拥有 outer operation/response；core batch 后按新 revision 为新/旧 holder 批量签 proof；shared transaction rollback/replay 覆盖 core/media/ledger，且无匿名/AI/provider surface"
    source: "design application ports、A15-A16"
    status: pending

