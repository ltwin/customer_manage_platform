    answered_at: 2026-07-22
    status: approved
  - id: H2
    decision: "roadmap 最终链路的 TG true-external transport：复用 2026-07-17 owner-attested 证据，或 fresh 脱敏真机复跑"
    recommended: "复用既有 true-external transport；fresh 验证同一 synthetic fixture 的次日 digest payload/调度关联"
    selected: "H2-A：复用既有 true-external transport；fresh 验证同一 synthetic fixture 的次日 digest payload/调度关联与完整 A24 主链"
    answered_at: 2026-07-22
    status: approved

dod:
  commands:
    - id: CMD-001
      command: "make check"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "cd frontend && npm run test:v1-hardening"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "bash -n scripts/*.sh"
      core: false
      failure_handling: fix-or-block
    - id: CMD-004
      command: "./scripts/test-v1-ops-contract.sh && docker build -t crm:v1-hardening ."
      core: true
      failure_handling: fix-or-block
    - id: CMD-005
      command: "./scripts/v1-ops-smoke.sh"
      core: true
      failure_handling: fix-or-block
    - id: CMD-006
      command: "git diff --check"
      core: false
      failure_handling: fix-or-block
  evidence_required:
    - "v1-hardening-design-review.md"
    - "v1-hardening-regression.yaml"
    - "v1-hardening-ops-case-catalog.yaml"
    - "evidence/browser/viewport-metadata.json"
    - "evidence/browser/<scenario-id>-<slug>.png"
    - "evidence/commands/CMD-001.log..CMD-006.log"
    - "evidence/ops/v1-ops-smoke.log"
    - "evidence/ops/v1-ops-smoke-results.json"
    - "v1-hardening-implementation.md"
    - "v1-hardening-review.md"
    - "v1-hardening-qa.md"
    - "v1-hardening-acceptance.md"
    - "v1-hardening-evidence-pack.md"
    - "v1-hardening-evidence-pack-results.json"
    - "v1-hardening-dod-contract-results.json"
    - "v1-hardening-dod-results.json"
    - "v1-hardening-gate-results.json"
    - "H1=接受时：../../issues/2026-07-22-auth-hardening/auth-hardening-report.md"
  cleanliness:
    debug_output: forbidden
    temporary_todos: forbidden
    commented_code: forbidden
    secrets_and_pii: forbidden
    partial_backup_artifacts: forbidden
    test_compose_residue: forbidden
    implicit_compose_target: forbidden

