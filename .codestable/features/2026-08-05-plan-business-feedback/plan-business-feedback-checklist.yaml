checks:
  - item: "PlanningBusinessFacts四字段完整replacement保留null/0区别，拥有独立revision；set_business_facts同时CAS并按material推进core plan revision"
    source: "design §1.6假设C、§2.1 HTTP保存facts、A1-A2"
    status: pending
  - item: "PublicPlanScale.planned_look_count与current Shot count只经core port读取；没有private look_count，planned_scene_count不从rented_location_count推导"
    source: "roadmap §4.10；design §0、§1.2、A6"
    status: pending
  - item: "planning-business-v1默认/账号完整override map版本化；section缺失preserve、map missing继承、null/0/value与value→inherit；same map保持revision/hash/fresh，material map才使旧fresh stale"
    source: "design §1.5、§2.1 EffectiveBusinessRuleProfileV1/Settings、A3-A5/A19"
    status: pending
  - item: "OrderAdjustmentLine只有delta；base顶层独立；unknown line排除并告警；base unknown仅absolute target可形成total，禁止line sum冒充总价"
    source: "roadmap §4.10；design §1.5、A3-A5"
    status: pending
  - item: "ScheduleDurationDraft只以estimated_duration_minutes为basis；missing order优先返回order_required；无任何shoot slot才create_new，future slot才update_existing，past/ongoing slot typed unavailable；0/null/overflow可区分"
    source: "design §1.5、§1.6假设D、§2.1 generation、§2.2 create_new、A7-A9/A21/A24"
    status: pending
  - item: "order/slot target fingerprint分别exact覆盖roadmap白名单，固定schema/JSON/null/UTC编码并由服务端计算；客户端request无fingerprint"
    source: "roadmap §4.10；design §2.1 canonical frame、A10-A13"
    status: pending
  - item: "fresh/stale/applied/dismissed projection、supersede与stale_reason优先级确定；applied/dismissed不被后续变化重写"
    source: "design §2.1状态投影、A11-A15"
    status: pending
  - item: "facts/generate/decision各有稳定operation/resource/canonical body；exact replay callback 0，异resource/body conflict，不同key并发最多一次target mutation"
    source: "design §2.2幂等/CAS、A2/A14"
    status: pending
  - item: "dismiss只锁business identity/revision/terminal，不调用Order/Schedule participant；fresh/stale及target已删除均可dismiss，applied仍409"
    source: "design §2.1 apply/dismiss、§2.2幂等/CAS、A15"
    status: pending
  - item: "订单apply只能在WithLockedTargetInScope callback内通过opaque scope写同一目标；重算stale/ack后更新price、追加唯一immutable audit、标draft applied并存ledger；任一失败全回滚"
    source: "design §2.2 apply order、A10-A11/A14/A16"
    status: pending
  - item: "Order/Schedule opaque scope有runtime active/single-use guard；use-after-callback、second apply、success-without-apply、apply-then-callback-error均fail closed且whole-tx rollback"
    source: "design §2.1 participant runtime guard；S4/S5"
    status: pending
  - item: "档期apply复用CRM/reminder staged lifecycle，锁序为fence→customer→order→slot→plans→opaque callback→business rows→scope write；禁止直接slot UPDATE、callback前写入或嵌套transaction"
    source: "design §2.2 apply existing schedule、A12-A14"
    status: pending
  - item: "Bearer+AccountScope是唯一business访问面；share/cross-account统一404，SharedPlanView、anonymous query/DTO/DOM/bundle零business字段"
    source: "roadmap §5；design §1.2、§2.1权限、A17"
    status: pending
  - item: "无策划订单/档期/报价/设置/reminder保持零提示零阻塞；business不读取share/reminder/media/AI，不自动通知客户或自动应用"
    source: "roadmap H1/H2；design §1.2、A18、§3.2"
    status: pending
  - item: "PlanningSchedulePrefillV1只携带order+basis并一次消费；URL/local/session/business journal/final POST零business payload；确认后仍复用普通schedule recovery"
    source: "roadmap §4.10；design §2.2 create_new、A9"
    status: pending
  - item: "Settings mutation participant以可选reminder fence→AccountSettingsMutationFence→settings row串行空行首次CAS和联合PATCH；CAS/fault时timezone generation/work与全部字段全回滚"
    source: "design §2.1 Settings/interface、A19/A22"
    status: pending
  - item: "facts/rule输入范围、checked int64/时间运算、PostgreSQL integer落值、warning closed enum和plan lifecycle guard均有exact error/zero-write证据"
    source: "design §1.5/§1.6假设E、A21"
    status: pending
  - item: "同次双draft持久化同一generation_id/source snapshot；detail对0/1/2 draft与lines查询恒定，planning list零business query/DTO/badge"
    source: "design §2.1 generation/detail、frontend conformance、A23"
    status: pending
  - item: "tracked v2 business facts、两类draft、unknown、stale/re-generate、破坏性确认、dismiss与无slot日历路径形成child-level conformance matrix"
    source: "design §2.2 frontend conformance、A20/A23"
    status: pending
  - item: "结构健康度不向759行schedule repository、order repository、api client追加business编排；新business子包/adapter/handler/component保持职责局部"
    source: "design §2.5"
    status: pending
  - item: "stage-2-evidence-go只阻止implementation dispatch；gate未passed时S2之后不得产生implementation diff，design不伪称已获批准"
    source: "roadmap §6/§8.2；design §1.7、S1"
    status: pending

