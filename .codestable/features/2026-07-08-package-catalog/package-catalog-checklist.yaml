  - action: "前端 API client：新增 listPackages/createPackage/updatePackage/deletePackage 方法，类型引用 schema.d.ts，不手写 DTO"
    exit_signal: "`cd frontend && npm run build` 类型检查通过；client 方法类型全部来自 paths[...]"
    status: done
  - action: "前端 PackagesPage 迁移：从原型内存桩改真 API，接通列表 loading/error/empty、元↔分单位换算、status 过滤、新建/编辑/上下架/删除（二次确认）接线；移除原型桩 import"
    exit_signal: "浏览器演示：新建套系→列表可见→编辑改价（显示价与录入价一致）→下架后 active 列表消失/archived 可见→删除录错套系（二次确认后移除）；PackagesPage grep 无 usePrototypeStore/prototypeStoreContext import"
    status: done
  - action: "harden 与终验：补 UI polish（loading/error/empty/长名称/375px/focus/keyboard/下架态视觉/删除确认弹窗）、范围守护、清洁度清扫和命令终验"
    exit_signal: "`make check` 退出码 0；A11/A12 截图或录屏归档；范围守护（下架无 in-use、删除 in-use 领域方法非空桩、无订单实现）和清洁度 grep/diff review 通过"
    status: done

