dod:
  commands:
    - id: CMD-001
      command: "make check"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "make generate && git diff --exit-code -- backend/internal/platform/httpapi/api.gen.go frontend/src/api/schema.d.ts"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "cd backend && go test ./..."
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: "cd frontend && npm run build"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, api_response, screenshots, diff_summary]
  cleanliness:
    debug_output: forbidden
    exceptions: "platform 既有结构化日志是功能本身；删除 in-use 领域方法必须可运行实现，不得写 TODO 空桩"
    todo_fixme: forbidden-unless-tracked
    commented_out_code: forbidden
    unused_imports: forbidden
    real_pii: forbidden
