    status: done
  - action: "HTTP 垂直切片：新增 packages.go handler，注册受保护 POST /packages、GET /packages、PATCH /packages/{id}、DELETE /packages/{id}，接入 ErrorEnvelope、AccountContext 和 package service"
    exit_signal: "API 集成测试覆盖 201/200/204/400/401/404 路径；删除无引用套系 204、跨账号 404；订单/档期端点仍返回 404"
