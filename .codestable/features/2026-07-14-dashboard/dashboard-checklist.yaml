feature: 2026-07-14-dashboard
created: 2026-07-14

dod:
  commands:
    - id: CMD-001
      command: "make check"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "make generate && git diff --exit-code -- backend/internal/platform/httpapi/api.gen.go frontend/src/api/schema.d.ts"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, api_response, browser_screenshot, diff_summary]
  cleanliness:
    debug_output: forbidden
    temporary_todo: forbidden
    commented_out_code: forbidden

steps:
  - action: "契约权威源+机器形式：cs-roadmap update §4.3 ListItem 措辞，OpenAPI 改形，include-tags 追加 dashboard，make generate"
    exit_signal: "roadmap 与 OpenAPI 一致且生成物可引用 Dashboard 响应与 ListItem 字段？"
    status: done
  - action: "编排骨架+日界共享：下沉 AccountClock 供 reminder/dashboard 同源引用，空五块 Service/Repository，D9 时区注入，注册 GET /dashboard"
    exit_signal: "共享 clock 被两包引用且 reminder 既有日界测绿；鉴权 GET 200 五键空值；dashboard 不 import httpapi？"
    status: done
  - action: "计算节点·提醒：实现 due 近3天窗（含逾期与全部类型）与 churn 全量 pending 查询排序"
    exit_signal: "单测覆盖窗内/窗外/逾期/同条 churn 双卡出现？"
    status: done
  - action: "计算节点·今日档期：账号本地日界相交 + D8 导出 schedule 摘要装配（首选）"
    exit_signal: "跨日相交用例通过，且 S13 摘要字段与排序均与 GET /schedule/slots 一致？"
    status: done
  - action: "计算节点·尾款与 recent_stats：delivered 未结清列表+三统计（含 price=NULL）"
    exit_signal: "与宽 unpaid_balance 差异、cancelled/窗口边界、NULL price 单测通过？"
    status: done
  - action: "前端接真：脱离原型 TODAY/byId，fetchDashboard 渲染五卡（尾款按笔数），完成/忽略/收讫后重拉，档期行可跳转"
    exit_signal: "浏览器五卡为真实 API、动作后交叉一致、无 price/2 推算、档期可进日历/客户？"
    status: done
  - action: "polish/harden：空态加载错误、401、时区失败500、非默认时区日界、小屏可滚动；make check"
    exit_signal: "验收场景 S1–S14 均有证据且 make check 绿？"
    status: done

