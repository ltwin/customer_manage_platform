  - id: S2
    action: "接PlanningReminderAccountGeneration fence、带generation的ShareAssignmentSourceEventV1、core generation-work reader、planshare safe source reader、reminder epoch repository、assignment Inbox、universal generation resolution、revision gate、durable quarantine/repair、materialized stable reconciliation epoch与contiguous watermark"
    exit_signal: "A5-A7/A22的canonical two-phase fence、三个owner窄port/depguard、重复/乱序/corrupt/quarantine/backoff/repair/漏事件/epoch supersede/crash/restart/双实例/multi-plan/mixed-kind矩阵唯一；reminder coordinator组合三组plan IDs后由epoch repository物化，planshare adapter不claim core work或写epoch；assignment写Inbox+event/rebuild resolution，CRM/archive/settings/temporal按kind验证后写universal resolution，非assignment不伪造Inbox；目标范围仍有pending/quarantined或applied缺matching resolution时不得complete；非法token/reserve/duplicate fail closed，失败不ack、不越过generation且无source/group/reminder半写"
