    - anonymous_rate_admission_replay_ceiling_fixture
    - global_security_counter_cross_instance_restart_fixture
    - global_security_counter_daily_digest_rollover_continuity_fixture
    - crm_share_lock_order_concurrency_matrix
    - core_readiness_guard_and_archive_ack_fixture
    - expiry_default_clamp_boundary_and_canonical_replay_fixture
