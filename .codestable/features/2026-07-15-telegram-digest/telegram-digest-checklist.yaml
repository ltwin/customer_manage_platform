feature: 2026-07-15-telegram-digest
created: 2026-07-15

steps:
  - id: STEP-001
    action: "契约骨架：收编 bind-token feature tag、双端 codegen、Telegram 可选配置与账号级 bind/delivery migration shape"
    exit_signal: "CMD-002 通过；migration up/down、chat 唯一、token/delivery 账号约束的 PostgreSQL 测试全部通过"
    status: done
  - id: STEP-002
    action: "模块骨架：建立 reminder/digest 应用边界、typed TelegramError、sender/update ports、production/fake adapter 与 bind/delivery transaction seam"
    exit_signal: "无外网 fake 跑通 claim lease→gate→call-boundary fence→Send→finalize；DeliveryRepository assert-callable/result/release、独立2秒cleanup、recipient/superseded与gate契约通过"
    status: done
  - id: STEP-003
    action: "安全绑定：实现 43-char opaque 10 分钟单次 token、private /start、scoped token/chat resolvers、chat 唯一/重绑与 HTTP handler"
    exit_signal: "正常、过期、篡改、重放、群聊、token/chat resolver 0/1/>1、并发 Issue/Consume/PATCH/rebind、历史 pending ack supersede/最新 ack 唯一测试通过；客户端 payload 从不构造 scope且无敏感泄漏"
    status: done
  - id: STEP-004
    action: "摘要计算：实现冻结 target date/timezone、三块跨域 Snapshot 与 ≤3500 Unicode code point 的确定性 Renderer"
    exit_signal: "提醒 20+overflow、shoot slot parity、窄 unpaid、空态、DST、跨午夜/改时区与文本边界测试全部通过"
    status: done
  - id: STEP-005
    action: "入站命令：接通 getUpdates 30 秒 long polling、durable handling→offset ack、/today EnsureScan→message_kind→claim 与 poll error state machine"
    exit_signal: "fetch/scan/claim/批次 crash、claim rollback/commit-unknown、update 重投、八类 TelegramError 的 operation×kind 状态转换、terminal poison update、context 取消测试全部通过；失败项不确认连续后缀，重投不重复 Delivery 或改变 message_kind"
    status: done
  - id: STEP-006
    action: "每日投递：接通 scan-before-send、每分钟 tick、daily local-date once、重启补发与持久 1/5/30 分钟 retry"
    exit_signal: "时区/scan/retry通过；双claim、resolver后/send前fence、pre-send/send-started cancel、cleanup失败/unknown、lease/stale result通过；gate优先取消跨账号与recipient退避公平唤醒通过"
    status: done
  - id: STEP-007
    action: "设置页交互：接入 Telegram 绑定卡片、deep-link 内存生命周期、重新绑定及 loading/error/popup-blocked 状态，并纳入 Makefile test"
    exit_signal: "CMD-004 单独通过且 CMD-001 执行该脚本；桌面/375px/键盘/focus/错误恢复通过；DOM/storage/bundle 不展示或持久化 Bind token"
    status: done
  - id: STEP-008
    action: "端到端 harden：装配单 TelegramRunner、真 Bot synthetic 冒烟、凭证/单 replica/无 webhook 运维文档、范围清扫与全量回归"
    exit_signal: "脱敏真机 binding/daily/today 截图齐全；Telegram disabled/suspended 不影响 Web；CMD-001～005 全绿且 N1～N7 scoped review 无违规"
    status: done

