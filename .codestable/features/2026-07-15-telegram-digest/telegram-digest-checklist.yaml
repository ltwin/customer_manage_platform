dod:
  commands:
    - id: CMD-001
      command: "make check"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "make generate && git diff --exit-code -- backend/internal/platform/httpapi/api.gen.go frontend/src/api/schema.d.ts"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "cd backend && go test ./internal/reminder/... ./internal/settings/... ./internal/platform/config/... ./internal/platform/httpapi/... ./cmd/server/... -count=1 -parallel=1"
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: "cd frontend && npm run test:telegram-digest"
      core: true
      failure_handling: fix-or-block
    - id: CMD-005
      command: "git diff --check"
      core: false
      failure_handling: fix-or-block
  evidence_required:
    - command_output
    - diff_summary
    - api_response
    - browser_screenshot
    - telegram_screenshot
    - sanitized_log_excerpt
    - owner_decision_record
  cleanliness:
    debug_output: forbidden
    temporary_todo_fixme: forbidden
    commented_out_code: forbidden
    unused_imports: forbidden
    credential_or_pii_logs: forbidden
    real_customer_evidence: forbidden
