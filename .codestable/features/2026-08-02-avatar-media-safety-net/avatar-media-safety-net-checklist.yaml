      command: "scripts/test-avatar-media-v1-restore-wipe.sh"
      core: true
      failure_handling: fix-or-block
      notes: "本 feature 自有脚本（名以 implement 为准）。调用真实 restore-compose/v1-ops-package；前置：Docker Desktop desktop-linux + 可用 app 镜像（notes 写明 tag/构建命令）。产出 restore_fixture_log。断言：DB 多余行消失（counts=包）且 avatars/*/account-profile/** 不存在；禁止要求 v2 generate manifest_sha256==v1 包摘要。不修改 v1-hardening catalog。"
    - id: CMD-005
      command: "scripts/check-avatar-media-safety-net-scope.sh"
      core: true
      failure_handling: fix-or-block
      notes: "A16 范围守护脚本（本条新增，名以 implement 为准）。必须：(1) git diff --name-only --diff-filter=d $(merge-base)...HEAD；(2) 并上 git ls-files --others --exclude-standard；(3) 排除本 feature 目录与 roadmap 规划文；(4) 对列表 rg 词表，命中 exit 1，无命中 exit 0；禁止 || true；fixture 例外路径写死在脚本 allowlist 并打印。"
    - id: CMD-006
      command: "make generate-check"
      core: false
      failure_handling: fix-or-block
    - id: CMD-007
      command: "make check"
      core: false
      failure_handling: fix-or-block
      notes: "已含 CMD-002/003；全仓回归可选。"
