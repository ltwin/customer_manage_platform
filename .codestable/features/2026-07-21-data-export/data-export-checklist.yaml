feature: 2026-07-21-data-export
created: 2026-07-21

dod:
  commands:
    - id: CMD-001
      command: "make check"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "make generate && git diff --exit-code -- backend/internal/platform/httpapi/api.gen.go frontend/src/api/schema.d.ts"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "cd backend && go test ./internal/platform/store/... ./internal/dataexport/... ./internal/platform/httpapi/... ./cmd/server/... -count=1 -parallel=1"
      core: true
      failure_handling: fix-or-block
    - id: CMD-004
      command: "cd frontend && npm run test:data-export && npm run build"
      core: true
      failure_handling: fix-or-block
  evidence_required: [command_output, api_response, response_headers, postgres_integration, browser_screenshot, diff_summary]
  cleanliness:
    debug_output: forbidden
    temporary_todo: forbidden
    commented_out_code: forbidden
    sensitive_payload_artifact: forbidden

steps:
  - id: STEP-001
    action: "结构微重构：把 AccountScope 事务类型、入口与 TxAccountScope delegates 纯移动到独立事务文件，不改签名或行为"
    exit_signal: "store 既有测试全绿、公开 Go 签名与 SQL 行为零变化，diff 只有 move/import 调整？"
    status: done
  - id: STEP-002
    action: "契约与隔离编排骨架：把 /export 匿名 response 提升为 OpenAPI ExportDocument/ExportCounts 命名 component（保持字段/required、禁止额外属性、counts minimum=0），让响应经 $ref 引用，细化 headers、启用 export tag/codegen，并建立 dataexport interface 与未挂生产 route 的 handler 隔离测试"
    exit_signal: "生成物出现可命名的 ExportDocument/ExportCounts 顶层类型且零漂移；handler fake 返回 schema_version=1、七个空数组和零 counts；router/composition root 仍未暴露伪空生产导出？"
    status: done
  - id: STEP-003
    action: "一致快照与全量计算节点：实现窄 ReadTxAccountScope + REPEATABLE READ READ ONLY 快照、七类 allowlist 批量查询、有效 settings、repository 稳定排序与 len-derived counts；真实 repository 完成后才挂生产 route/composition root"
    exit_signal: "真实 PostgreSQL fixture 与空账号通过 A2–A4、A8、A16–A18；同一事务 session 独立证明 transaction_isolation=repeatable read、transaction_read_only=on，且 production ReadTxAccountScope 无写方法；生产 route 无 token 401、有效 token 读取真实数据？"
    status: done
  - id: STEP-004
    action: "安全与失败 harden：补跨账号、敏感字段排除、依赖/空 scope、发送前 JSON 预序列化与 context cancel、headers 后 transport 边界、headers/文件名与脱敏日志证据"
    exit_signal: "A5–A11 负向测试通过，JSON key 扫描无内部 generation、凭证或运行状态？"
    status: done
  - id: STEP-005
    action: "前端下载 client：实现 Bearer Blob fetch、严格 MIME media-type 解析、精确 whole-string filename regex/fallback、ApiError/401 与可释放 object URL；补 body/blob 读取拒绝边界，新增 npm run test:data-export 并接入 Makefile test"
    exit_signal: "定向脚本覆盖 token、成功 Blob、application/json 合法参数、错误 base type/substring/+json、精确文件名、500/401 与 response.blob() rejection；读取拒绝时 client 无结果、无 object URL/download且呈现可重试错误；make test 实际运行该脚本？"
    status: done
  - id: STEP-006
    action: "设置页交互：挂入独立 DataExportCard，补 loading/error/retry、具体敏感信息/reference-only 文案、Settings 加载失败独立可用、键盘与 375px 状态"
    exit_signal: "桌面与 375px 均能一次点击下载可解析 JSON；Settings 加载失败不隐藏卡片，导出失败可重试且无横向溢出或重复请求？"
    status: done
  - id: STEP-007
    action: "全链路验证与范围清扫：运行 CMD-001～004，保存 API header/JSON 与浏览器证据，确认显式不做项未进入 diff"
    exit_signal: "全部核心场景有证据、make check 全绿，且无临时或敏感产物残留？"
    status: done

