  - item: "AccountScope.ScalarAggregate 守 fail-loud：op 仅 count/max/sum 白名单、列名字面量校验、cond 占位符、NULL-safe、不支持 GROUP BY，附 op×空集/有值/跨账号单测矩阵（D11/FDR-004，compound accountscope-fail-loud）"
    source: 流程级约束
    status: passed
  - item: "orders 表带 (account_id,customer_id) 与 (account_id,package_id) 复合外键防跨账号引用；package_id 可空；八态与金额非负 CHECK（D12）"
    source: 流程级约束
    status: passed
  - item: "merge 迁移订单：source 订单 customer_id 同事务改挂 target，履行 §4.2 契约随域生长（A18）"
    source: 流程级约束
    status: passed
  - item: "套系删除 in-use 接通真实 orders 表（any-reference 口径含 cancelled）：被引用 409 package_in_use、无引用 204；package_test.go 手工建表改依赖真实迁移（A19/A20）"
    source: 流程级约束
    status: passed
  - item: "OpenAPI 契约已在 design 阶段按 2026-07-09 roadmap update 收编（OrderListItem/unpaid_balance 口径/默认排序/POST 补录直达/DELETE 端点）并生成同步，实现期不再改契约；仅 include-tags 加 orders；router.go 只注册 orders 四端点；schedule/reminder/dashboard/settings 仍 404（A27，compound openapi-feature-tag-slicing）"
    source: 流程级约束
    status: passed
  - item: "明确不做反向核对：无支付集成、无档期联动、无提醒生成、无批量操作/批量导入；订单删除仅限终态、非终态无删除路径（A24/A25/A26/A28/A30）"
    source: 流程级约束
    status: passed
  - item: "前端约单 tab + OrdersPage 覆盖可见状态：空态/加载态/错误态/终态禁用推进/推进只暴露合法动作（下一态/跳过精修直接交付/取消）/推进 shot・delivered 日期确认默认今天/取消二次确认 + 原因 note 引导/补录模式（状态选择 + 动态必填日期收款字段 + 下架套系标注）/删除入口仅终态 + 二次确认（closed 明示统计影响）/「定金未收」弱提示徽章/未命名订单兜底/长标题/375px/focus/键盘（A21-A23，交互契约 9 项）"
    source: 名词契约
    status: passed
  - item: "前端 API 类型一律引用 schema.d.ts 生成类型，不手写重复 DTO；约单 tab 迁移后无原型桩残留 import（前端规范）"
