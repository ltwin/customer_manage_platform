# 部署双轨（design D6）：
# - 只起本地 dev 库：make db-up（= docker compose up -d --wait postgres）
# - 全容器模式：cp .env.example .env && docker compose up -d --wait（app 服务在 S9 接线）
# 凭证一律经 .env / 环境注入，本文件不硬编码任何凭证。
services:
  app:
    build: .
    image: crm:local
    env_file:
      - path: .env
        required: false # 单起 postgres（make db-up）时无需 .env
    environment:
      # 缺省 = 全容器模式直连 compose 内 postgres 服务；接现有 PG 时在 .env 设
      # APP_DATABASE_URL 指过去并用 `docker compose up -d --no-deps --wait app`
      # 只起 app（review REV-005）。凭证经 .env 注入（cp .env.example .env）。
      DATABASE_URL: ${APP_DATABASE_URL:-postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm-dev-password}@postgres:5432/${POSTGRES_DB:-crm}?sslmode=disable}
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # healthz 就绪语义：migrate 先于监听，running ≠ 已就绪（design D6，支撑 --wait）
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-crm} -d $${POSTGRES_DB:-crm}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
