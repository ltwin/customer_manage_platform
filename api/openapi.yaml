          description: 当前账号资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [account-profile]
      operationId: patchAccountProfile
      summary: 条件更新展示名称
      parameters:
        - $ref: "#/components/parameters/ProfileIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
