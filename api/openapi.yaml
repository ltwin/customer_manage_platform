      operationId: getDashboard
      summary: 今日经营台聚合（口径单点在服务端，§4.3）
      responses:
        "200":
          description: 聚合数据
          content:
            application/json:
              schema:
                type: object
                required:
                  [due_reminders, today_slots, unpaid_orders, churn_alerts, recent_stats]
                properties:
                  due_reminders:
                    description: due_date ≤ 账号时区今日+2 天且 pending（近 3 天窗口含逾期；含全部 type，含 churn）
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  today_slots:
                    description: 与账号本地今日半开日界相交的档期；shoot 含订单+客户摘要，语义与 GET /schedule/slots 一致
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleSlotListItem"
                  unpaid_orders:
                    type: object
                    required: [count, items]
                    properties:
                      count:
                        type: integer
                        description: 与 items 长度一致（不截断）
                      items:
                        description: status=delivered 且 balance_paid=false（closed 必已结清故不出现；窄于 unpaid_balance）
                        type: array
                        items:
                          $ref: "#/components/schemas/OrderListItem"
                  churn_alerts:
                    description: type=churn 且 pending
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  recent_stats:
                    type: object
                    required: [orders_created, orders_delivered, revenue_confirmed]
                    properties:
                      orders_created:
                        description: 近 30 天内按 created_at 统计，含全部状态
                        type: integer
                      orders_delivered:
                        description: 近 30 天内按 delivered_at 统计，排除当前 status=cancelled
                        type: integer
                      revenue_confirmed:
                        type: integer
                        description: 分；近 30 天 delivered_at 落窗口、balance_paid=true 且当前非 cancelled 的订单 price 之和
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /export:
    get:
      tags: [export]
      operationId: exportAll
      summary: 全量导出（application/json 附件；counts 必须与各数组长度一致，§4.6）
      responses:
        "200":
          description: 全量导出文件（Content-Disposition 附件）
          headers:
            Content-Disposition:
              description: 安全 UTC 文件名的附件声明
              schema:
                type: string
                pattern: '^attachment; filename="photographer-crm-export-[0-9]{8}T[0-9]{6}Z\.json"$'
            Content-Length:
              description: 完整预序列化 JSON bytes 长度
              schema:
                type: integer
                minimum: 0
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /account/profile:
    get:
      tags: [account-profile]
      operationId: getAccountProfile
      summary: 读取当前账号资料（无行时返回虚拟默认）
      responses:
        "200":
          description: 当前账号资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [account-profile]
      operationId: patchAccountProfile
      summary: 条件更新展示名称
      parameters:
        - $ref: "#/components/parameters/ProfileIfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name:
                  type: string
                  nullable: true
      responses:
        "200":
          description: 更新后的账号资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: profile_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /account/profile/avatar:
    put:
      tags: [account-profile]
      operationId: putAccountProfileAvatar
      summary: 条件设置或替换账号头像（原始合规字节，非客户 PNG 归一化）
      parameters:
        - $ref: "#/components/parameters/AvatarIfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 设置后的账号资料；same-content 完整对象重放为 no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: avatar_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [account-profile]
      operationId: deleteAccountProfileAvatar
      summary: 条件移除账号头像
      parameters:
        - $ref: "#/components/parameters/AvatarIfMatch"
      responses:
        "200":
          description: 移除后的账号资料；已无头像时为 no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: avatar_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /account/profile/avatar/content:
    get:
      tags: [account-profile]
      operationId: getAccountProfileAvatarContent
      summary: 经账号鉴权读取当前强版本账号头像内容
      parameters:
        - name: v
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AvatarVersion"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            pattern: '^"sha256-[0-9a-f]{64}"$'
      responses:
        "200":
          description: 完整性已验证的当前头像字节
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Vary:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: If-None-Match 命中当前完整对象
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: avatar_version_stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AvatarIfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前 avatar_revision 的 quoted token，例如 "ar-3"
      schema:
        type: string
        pattern: '^"ar-(0|[1-9][0-9]*)"$'
    ProfileIfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前 AccountProfile.profile_revision 的 quoted token，例如 "pr-3"
      schema:
        type: string
        pattern: '^"pr-(0|[1-9][0-9]*)"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选安全重放键；组合流程及从档期跳转的历史订单补录必须传。只持久化成功 2xx；24 小时内同账号、同操作、同 key、同规范化请求返回首次成功结果；成功绑定后的同 key 异请求返回 409 idempotency_conflict；客户端收到任意 5xx 时必须用原 body/key 重放确认，不得换 key
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1

  responses:
    ValidationFailed:
      description: 400 validation_failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 401 unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 403 forbidden（Origin 缺失或与 PUBLIC_BASE_URL 不一致）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidOrExpiredToken:
      description: 400 invalid_or_expired_token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 429 rate_limited
      headers:
        Retry-After:
          schema:
            type: integer
          description: 固定秒数；不暴露 limiter 维度
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RegistrationDisabled:
      description: 503 registration_disabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 404 not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Internal:
      description: 500 internal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    AuthCapabilities:
      type: object
      additionalProperties: false
      required: [public_registration_enabled]
      properties:
        public_registration_enabled:
          type: boolean

    VerificationDispatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [verification_required]

    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          enum: [600]

    ErrorEnvelope:
      description: 统一错误封套；含认证错误码与既有业务 conflict 子码
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              $ref: "#/components/schemas/ScheduleConflictDetails"

    ScheduleConflictDetails:
      description: order_in_use / order_already_scheduled 的可行动上下文；出现时两个字段必返
      type: object
      required: [schedule_slot_id, schedule_start_at]
      properties:
        schedule_slot_id:
          type: string
        schedule_start_at:
          type: string
          format: date-time

    Account:
      description: 账号（摄影师）；永不含 password_hash
      type: object
      required: [id, email, created_at, timezone]
      properties:
        id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          readOnly: true
        timezone:
          type: string
          description: IANA 时区；Settings 未落地前返回 Asia/Shanghai，日历不得使用浏览器时区替代

    Birthday:
      description: 生日特例："MM-DD" 或 "YYYY-MM-DD"（年份可缺，§4.1）
      type: string
      pattern: "^([0-9]{4}-)?[0-9]{2}-[0-9]{2}$"

    CustomerChannel:
      type: string
      enum: [xiaohongshu, douyin, weibo, referral, other]
      x-enum-varnames:
        - CustomerChannelXiaohongshu
        - CustomerChannelDouyin
        - CustomerChannelWeibo
        - CustomerChannelReferral
        - CustomerChannelOther

    CustomerStatus:
      type: string
      enum: [active, merged, archived]

    AvatarRevision:
      type: string
      readOnly: true
      pattern: "^ar-(0|[1-9][0-9]*)$"
      example: ar-0

    AvatarVersion:
      type: string
      readOnly: true
      pattern: "^sha256-[0-9a-f]{64}$"

    SocialPlatform:
      type: string
      enum: [wechat, qq, telegram, xiaohongshu, douyin, weibo, other]
      x-enum-varnames:
        - SocialPlatformWechat
        - SocialPlatformQq
        - SocialPlatformTelegram
        - SocialPlatformXiaohongshu
        - SocialPlatformDouyin
        - SocialPlatformWeibo
        - SocialPlatformOther

    ShootType:
      type: string
      enum: [portrait, cosplay, other]
      x-enum-varnames:
        - ShootTypePortrait
        - ShootTypeCosplay
        - ShootTypeOther

    PricingMode:
      type: string
      enum: [per_duration, per_photo, fixed]
      x-enum-varnames:
        - PricingModePerDuration
        - PricingModePerPhoto
        - PricingModeFixed

    PackageStatus:
      type: string
      enum: [active, archived]
      x-enum-varnames:
        - PackageStatusActive
        - PackageStatusArchived

    OrderStatus:
      description: 语义与合法跃迁见 §4.2 订单状态机
      type: string
      enum: [consulting, scheduled, shot, selected, retouching, delivered, closed, cancelled]

    OrderCreationMode:
      type: string
      enum: [new, backfill]

    SlotType:
      type: string
      enum: [shoot, hold, busy]

    ReminderType:
      type: string
      enum: [birthday, follow_up, churn, custom]

    ReminderStatus:
      type: string
      enum: [pending, done, dismissed]

    Customer:
      type: object
      required: [id, account_id, created_at, display_name, channel, status, avatar_revision]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
        real_name:
          type: string
        phone:
          type: string
        birthday:
          $ref: "#/components/schemas/Birthday"
        channel:
          $ref: "#/components/schemas/CustomerChannel"
        referrer_customer_id:
          type: string
          description: channel=referral 时必填
        status:
          $ref: "#/components/schemas/CustomerStatus"
        merged_into_customer_id:
          type: string
          readOnly: true
        avatar_revision:
          $ref: "#/components/schemas/AvatarRevision"
        avatar_version:
          $ref: "#/components/schemas/AvatarVersion"
        avatar_url:
          type: string
          readOnly: true
          description: 仅当前有头像时存在；同源鉴权相对 URL，v 等于 avatar_version

    CustomerListItem:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [orders_count, last_shot_at]
          properties:
            orders_count:
              type: integer
              description: 非 cancelled 订单计数；order 域未落地前恒为 0
            last_shot_at:
              type: string
              format: date
              nullable: true
              description: 非 cancelled 订单 max(shot_at) 按账号时区截断；order 域未落地前恒为 null

    CustomerSummary:
      type: object
      required: [id, display_name, channel, status, avatar_revision]
      properties:
        id:
          type: string
        display_name:
          type: string
        channel:
          $ref: "#/components/schemas/CustomerChannel"
        status:
          $ref: "#/components/schemas/CustomerStatus"
        avatar_revision:
          $ref: "#/components/schemas/AvatarRevision"
        avatar_version:
          $ref: "#/components/schemas/AvatarVersion"
        avatar_url:
          type: string
          readOnly: true

    CustomerStats:
      type: object
      required: [orders_count, total_order_amount, last_shot_at]
      properties:
        orders_count:
          type: integer
          description: 非 cancelled 订单计数；order 域未落地前恒为 0
        total_order_amount:
          type: integer
          description: 分；非 cancelled 订单 price 之和；order 域未落地前恒为 0
        last_shot_at:
          type: string
          format: date
          nullable: true
          description: 口径同 CustomerListItem.last_shot_at

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [identities, notes, referrer, stats]
          properties:
            identities:
              type: array
              items:
                $ref: "#/components/schemas/SocialIdentity"
            notes:
              description: 倒序
              type: array
              items:
                $ref: "#/components/schemas/CustomerNote"
            referrer:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CustomerSummary"
            stats:
              $ref: "#/components/schemas/CustomerStats"

    SocialIdentity:
      type: object
      required: [id, account_id, created_at, customer_id, platform, handle]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        platform:
          $ref: "#/components/schemas/SocialPlatform"
        handle:
          type: string
        remark:
          type: string

    CustomerNote:
      type: object
      required: [id, account_id, created_at, customer_id, content]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        content:
          type: string
          maxLength: 500

    PackageInput:
      type: object
      required: [name, shoot_type, pricing_mode, base_price]
      properties:
        name:
          type: string
        shoot_type:
          $ref: "#/components/schemas/ShootType"
        pricing_mode:
          $ref: "#/components/schemas/PricingMode"
        base_price:
          type: integer
          description: 分
        duration_minutes:
          type: integer
        shot_count_min:
          type: integer
        shot_count_max:
          type: integer
        raw_delivery_count:
          type: integer
        retouch_count:
          type: integer
          description: 0=不含精修
        note:
          type: string
          maxLength: 500

    Package:
      allOf:
        - $ref: "#/components/schemas/PackageInput"
        - type: object
          required: [id, account_id, created_at, status]
          properties:
            id:
              type: string
              readOnly: true
            account_id:
              type: string
              readOnly: true
              description: 服务端由账号上下文写入，客户端永不传（ADR-001）
            created_at:
              type: string
              format: date-time
              readOnly: true
            status:
              $ref: "#/components/schemas/PackageStatus"

    PackageListItem:
      allOf:
        - $ref: "#/components/schemas/Package"
        - type: object
          required: [orders_count]
          properties:
            orders_count:
              type: integer
              description: 引用本套系的非 cancelled 订单计数；order 域未落地前恒为 0

    Order:
      type: object
      required: [id, account_id, created_at, customer_id, status, deposit_paid, balance_paid]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        package_id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        price:
          type: integer
          description: 分
        deposit_paid:
          type: boolean
          default: false
        balance_paid:
          type: boolean
          default: false
        shot_at:
          type: string
          format: date-time
          description: 进入 shot 时服务端自动写入，事后可 PATCH 修正（§4.2）
        delivered_at:
          type: string
          format: date-time
          description: 进入 delivered 时服务端自动写入，事后可 PATCH 修正（§4.2）
        note:
          type: string

    OrderListItem:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [customer_display_name]
          properties:
            customer_display_name:
              type: string
              description: 引用客户的 display_name（列表可读性摘要，§4.3 2026-07-09 update）
            package_name:
              type: string
              description: 引用套系的 name；未引用套系时缺省

    ScheduleSlot:
      type: object
      required: [id, account_id, created_at, start_at, end_at, type]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 必须 > start_at
        type:
          $ref: "#/components/schemas/SlotType"
        order_id:
          type: string
          description: type=shoot 时必填；同一订单最多关联一条 shoot slot
        note:
          type: string
          maxLength: 500

    ScheduleSlotListItemBase:
      type: object
      required: [id, account_id, created_at, start_at, end_at]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 必须 > start_at
        note:
          type: string
          maxLength: 500

    ShootScheduleSlotListItem:
      allOf:
        - $ref: "#/components/schemas/ScheduleSlotListItemBase"
        - type: object
          required:
            [type, order_id, customer_id, customer_display_name, customer_status,
             order_status, order_deposit_paid, order_balance_paid]
          properties:
            type:
              type: string
              enum: [shoot]
            order_id:
              type: string
              description: shoot slot 必返的关联订单 id
            customer_id:
              type: string
              description: 引用订单的当前客户 id；merge 后返回 target id，供恢复流程与客户档案订单 tab 使用
            customer_display_name:
              type: string
              description: 引用订单的当前客户名
            customer_status:
              allOf:
                - $ref: "#/components/schemas/CustomerStatus"
              description: 当前客户状态；客户归档后仍返回，供文本警示
            order_title:
              type: string
              description: 引用订单的标题；无标题时缺省，由前端按套系/客户兜底
            package_name:
              type: string
              description: 引用订单所选套系名；未选套系时缺省
            order_status:
              $ref: "#/components/schemas/OrderStatus"
            order_price:
              type: integer
              description: 订单价格，单位为分；订单未设置价格时缺省
            order_deposit_paid:
              type: boolean
              description: 订单定金是否已收
            order_balance_paid:
              type: boolean
              description: 订单尾款是否已收
            package_shoot_type:
              allOf:
                - $ref: "#/components/schemas/ShootType"
              description: 订单所选套系的拍摄类型；未选套系时缺省

    NonShootScheduleSlotListItem:
      allOf:
        - $ref: "#/components/schemas/ScheduleSlotListItemBase"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [hold, busy]
              description: hold/busy 不带订单或客户引用摘要

    ScheduleSlotListItem:
      oneOf:
        - $ref: "#/components/schemas/ShootScheduleSlotListItem"
        - $ref: "#/components/schemas/NonShootScheduleSlotListItem"
      discriminator:
        propertyName: type
        mapping:
          shoot: "#/components/schemas/ShootScheduleSlotListItem"
          hold: "#/components/schemas/NonShootScheduleSlotListItem"
          busy: "#/components/schemas/NonShootScheduleSlotListItem"

    Reminder:
      type: object
      required: [id, account_id, created_at, type, due_date, content, status, dedup_key]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        type:
          $ref: "#/components/schemas/ReminderType"
        customer_id:
          type: string
        order_id:
          type: string
        due_date:
          type: string
          format: date
        content:
          type: string
        status:
          $ref: "#/components/schemas/ReminderStatus"
        dedup_key:
          type: string
          description: unique per account（规则见 §4.4）

    ChurnThreshold:
      type: object
      required: [shoot_type, days]
      properties:
        shoot_type:
          $ref: "#/components/schemas/ShootType"
        days:
          type: integer

    ScheduleAvailabilityWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 账号时区的本地开始时间，HH:MM
        end:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 账号时区的本地结束时间，HH:MM；必须晚于 start

    ScheduleAvailabilityWeekly:
      type: object
      additionalProperties: false
      required: ["1", "2", "3", "4", "5", "6", "7"]
      properties:
        "1":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "2":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "3":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "4":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "5":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "6":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "7":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"

    ScheduleAvailability:
      type: object
      additionalProperties: false
      required: [weekly, min_opening_minutes, turnaround_minutes]
      properties:
        weekly:
          $ref: "#/components/schemas/ScheduleAvailabilityWeekly"
        min_opening_minutes:
          type: integer
          minimum: 15
          maximum: 480
        turnaround_minutes:
          type: integer
          minimum: 0
          maximum: 240

    Settings:
      type: object
      required:
        [timezone, birthday_lead_days, follow_up_after_days, churn_thresholds,
         digest_hour, availability]
      properties:
        timezone:
          type: string
          description: IANA，默认 Asia/Shanghai；所有 date-only 判定按此时区（§4.1）
        birthday_lead_days:
          type: integer
          default: 3
        follow_up_after_days:
          type: integer
          default: 7
        churn_thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ChurnThreshold"
          description: 默认全类型 180
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
          default: 9
          description: 按 timezone
        telegram_chat_id:
          type: string
        availability:
          $ref: "#/components/schemas/ScheduleAvailability"

    UpdateSettingsBody:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          description: IANA 时区
        birthday_lead_days:
          type: integer
        follow_up_after_days:
          type: integer
        churn_thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ChurnThreshold"
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
        availability:
          $ref: "#/components/schemas/ScheduleAvailability"

    ExportCounts:
      type: object
      additionalProperties: false
      required:
        [customers, social_identities, customer_notes, packages, orders,
         schedule_slots, reminders]
      properties:
        customers:
          type: integer
          minimum: 0
        social_identities:
          type: integer
          minimum: 0
        customer_notes:
          type: integer
          minimum: 0
        packages:
          type: integer
          minimum: 0
        orders:
          type: integer
          minimum: 0
        schedule_slots:
          type: integer
          minimum: 0
        reminders:
          type: integer
          minimum: 0

    AccountProfile:
      type: object
      additionalProperties: false
      required: [display_name, profile_revision, avatar_revision]
      properties:
        display_name:
          type: string
          nullable: true
        profile_revision:
          type: string
          pattern: '^pr-(0|[1-9][0-9]*)$'
        avatar_revision:
          type: string
          pattern: '^ar-(0|[1-9][0-9]*)$'
        avatar_version:
          $ref: "#/components/schemas/AvatarVersion"
        avatar_url:
          type: string
          description: 同源鉴权相对 URL；查询参数 v 等于当前强版本
        avatar_updated_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExportAccountProfileAvatar:
      type: object
      additionalProperties: false
      required: [version, media_type, size, updated_at]
      properties:
        version:
          $ref: "#/components/schemas/AvatarVersion"
        media_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        updated_at:
          type: string
          format: date-time

    ExportAccountProfile:
      type: object
      additionalProperties: false
      required: [display_name, profile_revision, avatar_revision, avatar, updated_at]
      properties:
        display_name:
          type: string
          nullable: true
        profile_revision:
          type: string
          pattern: '^pr-(0|[1-9][0-9]*)$'
        avatar_revision:
          type: string
          pattern: '^ar-(0|[1-9][0-9]*)$'
        avatar:
          allOf:
            - $ref: "#/components/schemas/ExportAccountProfileAvatar"
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ExportDocument:
      type: object
      additionalProperties: false
      required:
        [exported_at, schema_version, counts, customers, social_identities,
         customer_notes, packages, orders, schedule_slots, reminders, settings,
         account_profile]
      properties:
        exported_at:
          type: string
          format: date-time
        schema_version:
          type: integer
          enum: [3]
        counts:
          $ref: "#/components/schemas/ExportCounts"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        social_identities:
          type: array
          items:
            $ref: "#/components/schemas/SocialIdentity"
        customer_notes:
          type: array
          items:
            $ref: "#/components/schemas/CustomerNote"
        packages:
          type: array
          items:
            $ref: "#/components/schemas/Package"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        schedule_slots:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSlot"
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        settings:
          $ref: "#/components/schemas/Settings"
        account_profile:
          $ref: "#/components/schemas/ExportAccountProfile"
