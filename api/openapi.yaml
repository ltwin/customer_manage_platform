# 摄影师私域客户经营系统（CRM）HTTP API 契约。
# 语义权威源：.codestable/roadmap/photographer-private-crm/photographer-private-crm-roadmap.md §4；
# 本文件是其机器可执行形式（忠实转写，不做再设计）。发现契约问题回 cs-roadmap update，不在此私改。
# 端点集合 = §4.1 login + §4.3 各域清单 + §4.6 export ∪ 白名单 {GET /me}（/me 待收编进 §4.3，见 design D4）。
# /healthz 为运维端点，不进本契约。
openapi: 3.0.3
info:
  title: Photographer Private CRM API
  version: 0.1.0
  description: 首版单账号；所有资源端点隐式按当前账号过滤，客户端永不传 account_id（ADR-001）。

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 登录与当前账号（platform-skeleton 已实现）
  - name: customers
    description: 客户域（customer-core / customer-merge，未实现）
  - name: packages
    description: 套系域（package-price，未实现）
  - name: orders
    description: 订单域（order-tracking，未实现）
  - name: schedule
    description: 档期域（schedule-slots，未实现）
  - name: reminders
    description: 提醒域（reminder-engine，未实现）
  - name: settings
    description: 设置（settings-foundation，未实现）
  - name: dashboard
    description: dashboard 聚合（dashboard-today，未实现）
  - name: export
    description: 全量导出（data-export，未实现）

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 单账号密码登录，签发 Bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前账号信息（永不含 password_hash）
      responses:
        "200":
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /customers:
    post:
      tags: [customers]
      operationId: createCustomer
      summary: 30 秒建档端点（仅 3-4 项必填）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, channel, identity]
              properties:
                display_name:
                  type: string
                channel:
                  $ref: "#/components/schemas/CustomerChannel"
                referrer_customer_id:
                  type: string
                  description: channel=referral 时必填
                identity:
                  type: object
                  required: [platform, handle]
                  properties:
                    platform:
                      $ref: "#/components/schemas/SocialPlatform"
                    handle:
                      type: string
      responses:
        "201":
          description: 已建档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [customers]
      operationId: listCustomers
      summary: 客户列表（q 匹配 display_name/real_name/identity.handle）
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/CustomerChannel"
        - name: status
          in: query
          description: 缺省 active；可显式查 archived/all（§4.2 归档语义）
          schema:
            type: string
            enum: [active, merged, archived, all]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页客户列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: 客户详情（含 identities、notes 倒序、referrer 摘要）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 客户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Customer"
                  - type: object
                    required: [identities, notes]
                    properties:
                      identities:
                        type: array
                        items:
                          $ref: "#/components/schemas/SocialIdentity"
                      notes:
                        description: 倒序
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomerNote"
                      referrer:
                        type: object
                        description: referrer 摘要（§4.3；字段由 customer-core feature 细化）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [customers]
      operationId: updateCustomer
      summary: 渐进补全任意字段；{status:archived} 即归档（§4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                real_name:
                  type: string
                phone:
                  type: string
                birthday:
                  $ref: "#/components/schemas/Birthday"
                channel:
                  $ref: "#/components/schemas/CustomerChannel"
                referrer_customer_id:
                  type: string
                status:
                  $ref: "#/components/schemas/CustomerStatus"
      responses:
        "200":
          description: 更新后的客户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/identities:
    post:
      tags: [customers]
      operationId: addCustomerIdentity
      summary: 追加社交身份
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, handle]
              properties:
                platform:
                  $ref: "#/components/schemas/SocialPlatform"
                handle:
                  type: string
                remark:
                  type: string
      responses:
        "201":
          description: 已追加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialIdentity"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/identities/{identity_id}:
    delete:
      tags: [customers]
      operationId: deleteCustomerIdentity
      summary: 删除社交身份
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: identity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/notes:
    post:
      tags: [customers]
      operationId: addCustomerNote
      summary: 追加客户备注
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: 已追加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerNote"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/merge:
    post:
      tags: [customers]
      operationId: mergeCustomer
      summary: 把 source 客户 merge 进当前客户（语义见 §4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_customer_id]
              properties:
                source_customer_id:
                  type: string
      responses:
        "200":
          description: merge 后的 target 客户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: merge_conflict（source 非 active）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /packages:
    post:
      tags: [packages]
      operationId: createPackage
      summary: 新建套系
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [packages]
      operationId: listPackages
      summary: 套系列表（?status=active 供下单选择）
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PackageStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页套系列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Package"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /packages/{id}:
    patch:
      tags: [packages]
      operationId: updatePackage
      summary: 更新套系；归档 = PATCH {status:archived}（无 in-use 校验，§4.3）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                shoot_type:
                  $ref: "#/components/schemas/ShootType"
                pricing_mode:
                  $ref: "#/components/schemas/PricingMode"
                base_price:
                  type: integer
                  description: 分
                duration_minutes:
                  type: integer
                shot_count_min:
                  type: integer
                shot_count_max:
                  type: integer
                raw_delivery_count:
                  type: integer
                retouch_count:
                  type: integer
                  description: 0=不含精修
                status:
                  $ref: "#/components/schemas/PackageStatus"
      responses:
        "200":
          description: 更新后的套系
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: 新建订单（status=consulting）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id:
                  type: string
                package_id:
                  type: string
                title:
                  type: string
                price:
                  type: integer
                  description: 分
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_archived（引用 merged/archived 客户）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [orders]
      operationId: listOrders
      summary: 订单列表
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: unpaid_balance
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页订单列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /orders/{id}:
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: 状态跃迁与字段修正（状态机语义见 §4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
                deposit_paid:
                  type: boolean
                balance_paid:
                  type: boolean
                shot_at:
                  type: string
                  format: date-time
                delivered_at:
                  type: string
                  format: date-time
                title:
                  type: string
                price:
                  type: integer
                  description: 分
                note:
                  type: string
      responses:
        "200":
          description: 更新后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: invalid_status_transition（非法跃迁）| unpaid_balance（未结清进 closed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /schedule/slots:
    get:
      tags: [schedule]
      operationId: listScheduleSlots
      summary: 档期区间查询（含跨界 slot）
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 区间内档期
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSlot"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [schedule]
      operationId: createScheduleSlot
      summary: 新建档期（重叠不阻止，返回 overlaps 由前端提示）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at, end_at, type]
              properties:
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                type:
                  $ref: "#/components/schemas/SlotType"
                order_id:
                  type: string
                  description: type=shoot 时必填
                note:
                  type: string
      responses:
        "201":
          description: 已创建（含重叠提示）
          content:
            application/json:
              schema:
                type: object
                required: [slot, overlaps]
                properties:
                  slot:
                    $ref: "#/components/schemas/ScheduleSlot"
                  overlaps:
                    type: array
                    items:
                      type: string
                    description: 与新 slot 重叠的 slot_id 列表
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /schedule/slots/{id}:
    patch:
      tags: [schedule]
      operationId: updateScheduleSlot
      summary: 更新档期
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                type:
                  $ref: "#/components/schemas/SlotType"
                order_id:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: 更新后的档期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlot"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [schedule]
      operationId: deleteScheduleSlot
      summary: 删除档期（不自动变更订单状态，§4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /reminders:
    get:
      tags: [reminders]
      operationId: listReminders
      summary: 提醒列表
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReminderStatus"
        - name: due_before
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页提醒列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [reminders]
      operationId: createReminder
      summary: 手工创建自定义提醒
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, due_date, content]
              properties:
                type:
                  type: string
                  enum: [custom]
                customer_id:
                  type: string
                due_date:
                  type: string
                  format: date
                content:
                  type: string
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /reminders/{id}/done:
    post:
      tags: [reminders]
      operationId: markReminderDone
      summary: 标记提醒完成
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 更新后的提醒
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /reminders/{id}/dismiss:
    post:
      tags: [reminders]
      operationId: dismissReminder
      summary: 忽略提醒
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 更新后的提醒
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /admin/reminders/scan:
    post:
      tags: [reminders]
      operationId: scanReminders
      summary: 提醒扫描唯一手动触发入口（每日定时与手动共用，鉴权同 §4.1）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: 缺省=账号时区今日
      responses:
        "200":
          description: 扫描结果计数
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped, auto_dismissed]
                properties:
                  created:
                    type: integer
                  skipped:
                    type: integer
                  auto_dismissed:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 读取设置
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: 更新设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
                  description: IANA 时区
                birthday_lead_days:
                  type: integer
                follow_up_after_days:
                  type: integer
                churn_thresholds:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChurnThreshold"
                digest_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
      responses:
        "200":
          description: 更新后的设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /settings/telegram/bind-token:
    post:
      tags: [settings]
      operationId: createTelegramBindToken
      summary: 生成 TG 绑定 token 与 deep link（绑定流程见 §4.5）
      responses:
        "200":
          description: 绑定 token（10min 有效）
          content:
            application/json:
              schema:
                type: object
                required: [token, deep_link]
                properties:
                  token:
                    type: string
                  deep_link:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: 今日经营台聚合（口径单点在服务端，§4.3）
      responses:
        "200":
          description: 聚合数据
          content:
            application/json:
              schema:
                type: object
                required:
                  [due_reminders, today_slots, unpaid_orders, churn_alerts, month_stats]
                properties:
                  due_reminders:
                    description: due_date ≤ 账号时区今日且 pending
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  today_slots:
                    description: 今日档期（含订单+客户摘要，字段由 dashboard-today feature 细化）
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleSlot"
                  unpaid_orders:
                    type: object
                    required: [count, items]
                    properties:
                      count:
                        type: integer
                      items:
                        description: status=delivered 且 balance_paid=false（closed 必已结清故不出现）
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
                  churn_alerts:
                    description: type=churn 且 pending
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  month_stats:
                    type: object
                    required: [orders_created, orders_delivered, revenue_confirmed]
                    properties:
                      orders_created:
                        type: integer
                      orders_delivered:
                        type: integer
                      revenue_confirmed:
                        type: integer
                        description: 分；balance_paid=true 订单 price 之和
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /export:
    get:
      tags: [export]
      operationId: exportAll
      summary: 全量导出（application/json 附件；counts 必须与各数组长度一致，§4.6）
      responses:
        "200":
          description: 全量导出文件（Content-Disposition 附件）
          content:
            application/json:
              schema:
                type: object
                required:
                  [exported_at, schema_version, counts, customers, social_identities,
                   customer_notes, packages, orders, schedule_slots, reminders, settings]
                properties:
                  exported_at:
                    type: string
                    format: date-time
                  schema_version:
                    type: integer
                    enum: [1]
                  counts:
                    type: object
                    required:
                      [customers, social_identities, customer_notes, packages, orders,
                       schedule_slots, reminders]
                    properties:
                      customers:
                        type: integer
                      social_identities:
                        type: integer
                      customer_notes:
                        type: integer
                      packages:
                        type: integer
                      orders:
                        type: integer
                      schedule_slots:
                        type: integer
                      reminders:
                        type: integer
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                  social_identities:
                    type: array
                    items:
                      $ref: "#/components/schemas/SocialIdentity"
                  customer_notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerNote"
                  packages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Package"
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  schedule_slots:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleSlot"
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
                  settings:
                    $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1

  responses:
    ValidationFailed:
      description: 400 validation_failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 401 unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 404 not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Internal:
      description: 500 internal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      description: 统一错误封套（§4.1）；错误码 validation_failed | unauthorized | not_found | conflict 子码 | internal
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    Account:
      description: 账号（摄影师）；永不含 password_hash
      type: object
      required: [id, created_at]
      properties:
        id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    Birthday:
      description: 生日特例："MM-DD" 或 "YYYY-MM-DD"（年份可缺，§4.1）
      type: string
      pattern: "^([0-9]{4}-)?[0-9]{2}-[0-9]{2}$"

    CustomerChannel:
      type: string
      enum: [xiaohongshu, douyin, weibo, referral, other]

    CustomerStatus:
      type: string
      enum: [active, merged, archived]

    SocialPlatform:
      type: string
      enum: [wechat, qq, telegram, other]

    ShootType:
      type: string
      enum: [portrait, cosplay, other]

    PricingMode:
      type: string
      enum: [per_duration, per_photo, fixed]

    PackageStatus:
      type: string
      enum: [active, archived]

    OrderStatus:
      description: 语义与合法跃迁见 §4.2 订单状态机
      type: string
      enum: [consulting, scheduled, shot, selected, retouching, delivered, closed, cancelled]

    SlotType:
      type: string
      enum: [shoot, hold, busy]

    ReminderType:
      type: string
      enum: [birthday, follow_up, churn, custom]

    ReminderStatus:
      type: string
      enum: [pending, done, dismissed]

    Customer:
      type: object
      required: [id, account_id, created_at, display_name, channel, status]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
        real_name:
          type: string
        phone:
          type: string
        birthday:
          $ref: "#/components/schemas/Birthday"
        channel:
          $ref: "#/components/schemas/CustomerChannel"
        referrer_customer_id:
          type: string
          description: channel=referral 时必填
        status:
          $ref: "#/components/schemas/CustomerStatus"
        merged_into_customer_id:
          type: string
          readOnly: true

    SocialIdentity:
      type: object
      required: [id, account_id, created_at, customer_id, platform, handle]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        platform:
          $ref: "#/components/schemas/SocialPlatform"
        handle:
          type: string
        remark:
          type: string

    CustomerNote:
      type: object
      required: [id, account_id, created_at, customer_id, content]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        content:
          type: string
          maxLength: 500

    PackageInput:
      type: object
      required: [name, shoot_type, pricing_mode, base_price]
      properties:
        name:
          type: string
        shoot_type:
          $ref: "#/components/schemas/ShootType"
        pricing_mode:
          $ref: "#/components/schemas/PricingMode"
        base_price:
          type: integer
          description: 分
        duration_minutes:
          type: integer
        shot_count_min:
          type: integer
        shot_count_max:
          type: integer
        raw_delivery_count:
          type: integer
        retouch_count:
          type: integer
          description: 0=不含精修

    Package:
      allOf:
        - $ref: "#/components/schemas/PackageInput"
        - type: object
          required: [id, account_id, created_at, status]
          properties:
            id:
              type: string
              readOnly: true
            account_id:
              type: string
              readOnly: true
              description: 服务端由账号上下文写入，客户端永不传（ADR-001）
            created_at:
              type: string
              format: date-time
              readOnly: true
            status:
              $ref: "#/components/schemas/PackageStatus"

    Order:
      type: object
      required: [id, account_id, created_at, customer_id, status, deposit_paid, balance_paid]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        package_id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        price:
          type: integer
          description: 分
        deposit_paid:
          type: boolean
          default: false
        balance_paid:
          type: boolean
          default: false
        shot_at:
          type: string
          format: date-time
          description: 进入 shot 时服务端自动写入，事后可 PATCH 修正（§4.2）
        delivered_at:
          type: string
          format: date-time
          description: 进入 delivered 时服务端自动写入，事后可 PATCH 修正（§4.2）
        note:
          type: string

    ScheduleSlot:
      type: object
      required: [id, account_id, created_at, start_at, end_at, type]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 必须 > start_at
        type:
          $ref: "#/components/schemas/SlotType"
        order_id:
          type: string
          description: type=shoot 时必填
        note:
          type: string

    Reminder:
      type: object
      required: [id, account_id, created_at, type, due_date, content, status, dedup_key]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        type:
          $ref: "#/components/schemas/ReminderType"
        customer_id:
          type: string
        order_id:
          type: string
        due_date:
          type: string
          format: date
        content:
          type: string
        status:
          $ref: "#/components/schemas/ReminderStatus"
        dedup_key:
          type: string
          description: unique per account（规则见 §4.4）

    ChurnThreshold:
      type: object
      required: [shoot_type, days]
      properties:
        shoot_type:
          $ref: "#/components/schemas/ShootType"
        days:
          type: integer

    Settings:
      type: object
      required:
        [timezone, birthday_lead_days, follow_up_after_days, churn_thresholds, digest_hour]
      properties:
        timezone:
          type: string
          description: IANA，默认 Asia/Shanghai；所有 date-only 判定按此时区（§4.1）
        birthday_lead_days:
          type: integer
          default: 3
        follow_up_after_days:
          type: integer
          default: 7
        churn_thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ChurnThreshold"
          description: 默认全类型 180
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
          default: 9
          description: 按 timezone
        telegram_chat_id:
          type: string
