# 摄影师私域客户经营系统（CRM）HTTP API 契约。
# 语义权威源：.codestable/roadmap/photographer-private-crm/photographer-private-crm-roadmap.md §4；
# 本文件是其机器可执行形式（忠实转写，不做再设计）。发现契约问题回 cs-roadmap update，不在此私改。
# 端点集合 = self-service-account-system §4.4 认证 + 既有各域清单；GET /me 保留 timezone 并增加 verified email。
# /healthz 为运维端点，不进本契约。
openapi: 3.0.3
info:
  title: Photographer Private CRM API
  version: 0.1.0
  description: 多账号自助认证；所有资源端点隐式按当前账号过滤，客户端永不传 account_id（ADR-001）。

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: email-account-access
    description: 邮箱注册验证、登录、refresh、logout 与当前账号
  - name: public-auth-hardening
    description: 密码找回、重置与修改
  - name: customer-core
    description: 后端 codegen 切片标签（customer-core 已实现的客户三操作）
  - name: customer-profile-complete
    description: 后端 codegen 切片标签（customer-profile-complete 的档案五操作）
  - name: customer-avatar
    description: 后端 codegen 切片标签（客户头像条件写与鉴权读取）
  - name: reminder-engine
    description: 后端 codegen 切片标签（reminder-engine 的提醒五操作 + 设置读写）
  - name: customers
    description: 客户域（customer-core / customer-profile-complete）
  - name: packages
    description: 套系域（package-catalog）
  - name: orders
    description: 订单域（order-tracking）
  - name: schedule
    description: 档期域（schedule-slots，未实现）
  - name: reminders
    description: 提醒域（reminder-engine）
  - name: settings
    description: 设置（GET/PATCH 归 reminder-engine；telegram 绑定归 telegram-digest）
  - name: dashboard
    description: dashboard 聚合（dashboard）
  - name: export
    description: 全量导出（data-export）

paths:
  /auth/capabilities:
    get:
      tags: [email-account-access]
      operationId: getAuthCapabilities
      summary: 读取公开注册能力
      security: []
      responses:
        "200":
          description: 当前公开注册能力；不得缓存
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定 no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilities"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/register:
    post:
      tags: [email-account-access]
      operationId: register
      summary: 注册 pending_verification 账号并尝试发送验证邮件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
      responses:
        "202":
          description: 固定公开结果；不得据此判断账号或投递状态
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定 no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDispatch"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/RegistrationDisabled"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/email/resend:
    post:
      tags: [email-account-access]
      operationId: resendVerification
      summary: 以 generic outcome 重发验证邮件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 254
      responses:
        "202":
          description: 固定公开结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDispatch"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/email/verify:
    post:
      tags: [email-account-access]
      operationId: verifyEmail
      summary: 消费 verification／legacy claim token 并建立首个 session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 76
                  maxLength: 76
                  pattern: '^[0-9a-f]{32}\.[A-Za-z0-9_-]{43}$'
      responses:
        "200":
          description: 已验证并建立 session
          headers:
            Set-Cookie:
              schema:
                type: string
              description: __Host-crm_refresh；HttpOnly、Secure、Strict、Path=/、无 Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          $ref: "#/components/responses/InvalidOrExpiredToken"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/login:
    post:
      tags: [email-account-access]
      operationId: login
      summary: 邮箱密码登录并建立 refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
      responses:
        "200":
          description: 登录成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: __Host-crm_refresh；HttpOnly、Secure、Strict、Path=/、无 Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: forbidden（Origin）或 email_verification_required（密码正确但未验证）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/refresh:
    post:
      tags: [email-account-access]
      operationId: refresh
      summary: 使用 HttpOnly refresh cookie 轮换 session generation
      security: []
      responses:
        "200":
          description: refresh 成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: rotated __Host-crm_refresh cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: unauthorized；同时清除 refresh cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Max-Age=0 且 Expires 为过去时间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/logout:
    post:
      tags: [email-account-access]
      operationId: logout
      summary: 幂等撤销 refresh family 并清 cookie
      security: []
      responses:
        "204":
          description: 已退出；missing／expired／revoked 同样成功
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Max-Age=0 且 Expires 为过去时间
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/password/forgot:
    post:
      tags: [public-auth-hardening]
      operationId: forgotPassword
      summary: 请求密码重置邮件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 254
      responses:
        "202":
          description: 固定公开结果
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/password/reset:
    post:
      tags: [public-auth-hardening]
      operationId: resetPassword
      summary: 以 action token 重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 76
                  maxLength: 76
                  pattern: '^[0-9a-f]{32}\.[A-Za-z0-9_-]{43}$'
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 72
      responses:
        "204":
          description: 密码已更新、refresh sessions 已撤销且 cookie 已清除
        "400":
          description: validation_failed 或 invalid_or_expired_token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /auth/password/change:
    post:
      tags: [public-auth-hardening]
      operationId: changePassword
      summary: 已认证账号修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  minLength: 12
                  maxLength: 72
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 72
      responses:
        "204":
          description: 密码已更新、refresh sessions 已撤销且 cookie 已清除
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /me:
    get:
      tags: [email-account-access]
      operationId: getMe
      summary: 当前账号信息（永不含 password_hash）
      responses:
        "200":
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /customers:
    post:
      tags: [customers, customer-core]
      operationId: createCustomer
      summary: 30 秒建档端点（仅 3-4 项必填）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, channel, identities]
              properties:
                display_name:
                  type: string
                channel:
                  $ref: "#/components/schemas/CustomerChannel"
                referrer_customer_id:
                  type: string
                  description: channel=referral 时必填；介绍人须 active 且本账号可见，非 active 或跨账号按 404 处理
                identities:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [platform, handle]
                    properties:
                      platform:
                        $ref: "#/components/schemas/SocialPlatform"
                      handle:
                        type: string
                      remark:
                        type: string
      responses:
        "201":
          description: 已建档
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [customers, customer-core]
      operationId: listCustomers
      summary: 客户列表（q 匹配 display_name/real_name/phone/identity.handle）
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            $ref: "#/components/schemas/CustomerChannel"
        - name: status
          in: query
          description: 缺省 active；兼容单值/all，也接受逗号分隔的 active/archived/merged 状态集合；重复值、未知值或 all 与其他值混用均为 400；过滤发生在分页前
          schema:
            type: string
            pattern: "^(all|(active|merged|archived)(,(active|merged|archived))*)$"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页客户列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerListItem"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}:
    get:
      tags: [customers, customer-core]
      operationId: getCustomer
      summary: 客户详情（含 identities、notes 倒序、referrer 摘要）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 客户详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [customers, customer-profile-complete]
      operationId: updateCustomer
      summary: 渐进补全任意字段；{status:archived} 即归档（§4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: 不可清空（不接受 null）
                real_name:
                  type: string
                  nullable: true
                  description: 显式传 null 清空
                phone:
                  type: string
                  nullable: true
                  description: 显式传 null 清空
                birthday:
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/Birthday"
                  description: 显式传 null 清空
                channel:
                  $ref: "#/components/schemas/CustomerChannel"
                referrer_customer_id:
                  type: string
                  description: channel=referral 时必填；介绍人须 active 且本账号可见，非 active 或跨账号按 404 处理；不得为本客户自身（400）
                status:
                  type: string
                  enum: [active, archived]
                  description: merged 是 merge 端点专属终态，不可经 PATCH 设置
      responses:
        "200":
          description: 更新后的客户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_merged（merged 客户档案只读）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/avatar:
    put:
      tags: [customers, customer-avatar]
      operationId: putCustomerAvatar
      summary: 条件设置或替换客户头像；active/archived 可写，merged 恒为 customer_merged
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AvatarIfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 设置后的客户；same-content 完整对象重放为 no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_merged | avatar_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [customers, customer-avatar]
      operationId: deleteCustomerAvatar
      summary: 条件移除客户头像；merged 仅开放本 cleanup-only 操作
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AvatarIfMatch"
      responses:
        "200":
          description: 移除后的客户；已无头像时为 no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: avatar_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/avatar/content:
    get:
      tags: [customers, customer-avatar]
      operationId: getCustomerAvatarContent
      summary: 经账号鉴权读取当前强版本头像内容
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: v
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AvatarVersion"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            pattern: '^"sha256-[0-9a-f]{64}"$'
      responses:
        "200":
          description: 完整性已验证的当前头像字节
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Vary:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: 完整性验证通过且 If-None-Match 命中
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Vary:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: avatar_version_stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
  /customers/{id}/identities:
    post:
      tags: [customers, customer-profile-complete]
      operationId: addCustomerIdentity
      summary: 追加社交身份
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, handle]
              properties:
                platform:
                  $ref: "#/components/schemas/SocialPlatform"
                handle:
                  type: string
                remark:
                  type: string
      responses:
        "201":
          description: 已追加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialIdentity"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_merged（merged 客户档案只读）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/identities/{identity_id}:
    delete:
      tags: [customers, customer-profile-complete]
      operationId: deleteCustomerIdentity
      summary: 删除社交身份
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: identity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_merged（merged 客户档案只读）| last_identity（非 merged 客户至少保留 1 个社交身份）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/notes:
    post:
      tags: [customers, customer-profile-complete]
      operationId: addCustomerNote
      summary: 追加客户备注
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: 已追加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerNote"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_merged（merged 客户档案只读）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /customers/{id}/merge:
    post:
      tags: [customers, customer-profile-complete]
      operationId: mergeCustomer
      summary: 把 source 客户 merge 进当前客户（语义见 §4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_customer_id]
              properties:
                source_customer_id:
                  type: string
      responses:
        "200":
          description: merge 后的 target 客户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: merge_conflict（source 或 target 非 active）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /packages:
    post:
      tags: [packages]
      operationId: createPackage
      summary: 新建套系
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [packages]
      operationId: listPackages
      summary: 套系列表（?status=active 供下单选择）
      parameters:
        - name: status
          in: query
          description: 缺省 active；可显式查 archived/all（§4.3 套系上架/下架语义）
          schema:
            type: string
            enum: [active, archived, all]
            x-enum-varnames:
              - ListPackagesParamsStatusActive
              - ListPackagesParamsStatusArchived
              - ListPackagesParamsStatusAll
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页套系列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackageListItem"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /packages/{id}:
    patch:
      tags: [packages]
      operationId: updatePackage
      summary: 更新套系；归档 = PATCH {status:archived}（无 in-use 校验，§4.3）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                shoot_type:
                  $ref: "#/components/schemas/ShootType"
                pricing_mode:
                  $ref: "#/components/schemas/PricingMode"
                base_price:
                  type: integer
                  description: 分
                duration_minutes:
                  type: integer
                  nullable: true
                shot_count_min:
                  type: integer
                  nullable: true
                shot_count_max:
                  type: integer
                  nullable: true
                raw_delivery_count:
                  type: integer
                  nullable: true
                retouch_count:
                  type: integer
                  nullable: true
                  description: 0=不含精修
                note:
                  type: string
                  maxLength: 500
                status:
                  $ref: "#/components/schemas/PackageStatus"
      responses:
        "200":
          description: 更新后的套系
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [packages]
      operationId: deletePackage
      summary: 删除套系；被订单引用时返回 package_in_use（§4.3）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除，无响应体
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: package_in_use（套系已被订单引用，不可删除）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: 新建订单（creation_mode=new 为新业务，backfill 为历史补录）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                creation_mode:
                  allOf:
                    - $ref: "#/components/schemas/OrderCreationMode"
                  default: new
                  description: new=新业务，只允许 consulting/scheduled 且只能引用 active 客户/套系；backfill=历史补录，可按状态不变量直达并允许 active/archived 客户与套系，merged 客户仍拒绝
                customer_id:
                  type: string
                package_id:
                  type: string
                title:
                  type: string
                price:
                  type: integer
                  description: 分
                status:
                  allOf:
                    - $ref: "#/components/schemas/OrderStatus"
                  description: creation_mode=new 时缺省 consulting 且仅允许 consulting/scheduled；backfill 时可直达八态，≥shot 须显式 shot_at、≥delivered（含 closed）须显式 delivered_at，closed 须 balance_paid=true
                deposit_paid:
                  type: boolean
                  default: false
                balance_paid:
                  type: boolean
                  default: false
                shot_at:
                  type: string
                  format: date-time
                  description: 补录用；仅目标状态已到达 shot 时可给
                delivered_at:
                  type: string
                  format: date-time
                  description: 补录用；仅目标状态已到达 delivered 时可给
                note:
                  type: string
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_archived（new 引用 merged/archived 客户，或 backfill 引用 merged 客户）| unpaid_balance（补录 status=closed 且 balance_paid≠true）| idempotency_conflict（已成功绑定的同 key 使用不同请求体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [orders]
      operationId: listOrders
      summary: 订单列表（默认排序 created_at DESC、同值 id DESC，保证分页稳定，§4.3）
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: unpaid_balance
          in: query
          description: true = balance_paid=false 且 status ∈ {shot, selected, retouching, delivered}（已进入交付链条且未结清，§4.3 2026-07-09 口径）
          schema:
            type: boolean
        - name: schedulable_at
          in: query
          description: 目标 slot 的 end_at；服务端按它相对当前时刻应用与 POST/PATCH 相同的订单/客户未来历史矩阵并排除已有 shoot slot：未来要求客户 active，历史允许 active/archived，merged 永不允许；可与 customer_id 组合
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页订单列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderListItem"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /orders/{id}:
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: 状态跃迁与字段修正（状态机语义见 §4.2；status 等于当前状态时为 200 no-op）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
                deposit_paid:
                  type: boolean
                balance_paid:
                  type: boolean
                shot_at:
                  type: string
                  format: date-time
                delivered_at:
                  type: string
                  format: date-time
                title:
                  type: string
                price:
                  type: integer
                  description: 分
                note:
                  type: string
      responses:
        "200":
          description: 更新后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: invalid_status_transition（非法跃迁）| unpaid_balance（未结清进 closed / closed 订单试图取消结清标记，字段修正不变量见 §4.2）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [orders]
      operationId: deleteOrder
      summary: 物理删除终态订单（closed/cancelled，§4.3 2026-07-09）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除，无响应体；实时聚合/统计即时反映（删 closed 单会减少 orders_count 与营收类统计）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_not_terminal（非终态订单不可删除，先 cancel）| order_in_use（被 type=shoot 的 slot 引用；details 必返 schedule_slot_id/schedule_start_at）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /schedule/slots:
    get:
      tags: [schedule]
      operationId: listScheduleSlots
      summary: 档期区间查询（含跨界 slot）
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 半开区间 [from,to) 的 UTC 起点；月历传完整 6 周可见网格的账号本地日界
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 半开区间 [from,to) 的 UTC 终点
      responses:
        "200":
          description: 区间内档期
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSlotListItem"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [schedule]
      operationId: createScheduleSlot
      summary: 新建档期（支持跨日；重叠不阻止；同一订单最多一条 shoot slot）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at, end_at, type]
              properties:
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                type:
                  $ref: "#/components/schemas/SlotType"
                order_id:
                  type: string
                  description: type=shoot 时必填；未来/进行中只允许 consulting/scheduled 且客户须 active；历史补录允许 scheduled/shot/selected/retouching/delivered/closed 且客户可 active/archived；cancelled 或 merged 客户永不允许
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: 已创建（含重叠提示）
          content:
            application/json:
              schema:
                type: object
                required: [slot, overlaps]
                properties:
                  slot:
                    $ref: "#/components/schemas/ScheduleSlot"
                  overlaps:
                    type: array
                    items:
                      type: string
                    description: 与新 slot 重叠的 slot_id 列表
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_already_scheduled（订单已有 shoot slot，details 返回现有 slot）| customer_archived（未来档期的客户已归档/合并）| customer_changed（并发 merge 导致订单客户连续变化，需重拉候选）| idempotency_conflict（已成功绑定的同 key 使用不同请求体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /schedule/slots/{id}:
    get:
      tags: [schedule]
      operationId: getScheduleSlot
      summary: 按账号范围读取单条档期及展示摘要；用于 slot 深链定位
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 单条档期展示摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlotListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [schedule]
      operationId: updateScheduleSlot
      summary: 更新档期；时间/type/order 变化重验订单与客户矩阵，note-only 不重验外部状态
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                type:
                  $ref: "#/components/schemas/SlotType"
                order_id:
                  type: string
                  nullable: true
                  description: 显式 null 清空关联；省略表示不改
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: 显式 null 清空备注；省略表示不改
      responses:
        "200":
          description: 更新后的档期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlot"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_already_scheduled（目标订单已有另一条 shoot slot，details 返回现有 slot）| customer_archived（未来档期的客户已归档/合并）| customer_changed（并发 merge 导致订单客户连续变化，需重拉候选）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [schedule]
      operationId: deleteScheduleSlot
      summary: 删除档期（不自动变更订单状态，§4.2）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

