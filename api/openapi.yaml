              required: [display_name]
              properties:
                display_name:
                  type: string
                  nullable: true
      responses:
        "200":
          description: 更新后的账号资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: profile_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /account/profile/avatar:
    put:
      tags: [account-profile]
      operationId: putAccountProfileAvatar
      summary: 条件设置或替换账号头像（原始合规字节，非客户 PNG 归一化）
      parameters:
        - $ref: "#/components/parameters/AvatarIfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
