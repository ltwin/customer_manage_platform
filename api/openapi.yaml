        - name: eventId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidExecutionEventInput"
      responses:
        "201":
          description: 作废事实已追加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoidExecutionEventResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /shoot-plans/{id}/ingestion-sessions:
    post:
      tags: [planning-ingestion]
      operationId: createPlanIngestionSession
      summary: 创建策划摄取会话
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanIngestionSessionInput"
      responses:
        "201":
          description: 摄取会话已创建
          content: {application/json: {schema: {$ref: "#/components/schemas/PlanIngestionSession"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "500": {$ref: "#/components/responses/Internal"}

  /shoot-plans/{id}/ingestion-sessions/{sessionId}:
    get:
      tags: [planning-ingestion]
      operationId: getPlanIngestionSession
      summary: 恢复策划摄取会话
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 摄取会话
          content: {application/json: {schema: {$ref: "#/components/schemas/PlanIngestionSession"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}

  /shoot-plans/{id}/ingestion-sessions/{sessionId}/preview:
    post:
      tags: [planning-ingestion]
      operationId: previewPlanIngestionSession
      summary: 重新解析并保存摄取候选预览
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/PreviewPlanIngestionSessionInput"}}}
      responses:
        "200":
          description: 候选预览
          content: {application/json: {schema: {$ref: "#/components/schemas/PlanIngestionSession"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "500": {$ref: "#/components/responses/Internal"}

  /shoot-plans/{id}/ingestion-sessions/{sessionId}/transition:
    post:
      tags: [planning-ingestion]
      operationId: transitionPlanIngestionSession
      summary: 结束摄取会话
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/TransitionPlanIngestionSessionInput"}}}
      responses:
        "200":
          description: 会话已结束
          content: {application/json: {schema: {$ref: "#/components/schemas/PlanIngestionSession"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}

  /shoot-plans/{id}/ingestion-sessions/{sessionId}/commit:
    post:
      tags: [planning-ingestion]
      operationId: commitPlanIngestionSession
      summary: 原子提交摄取候选
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CommitPlanIngestionSessionInput"}}}
      responses:
        "200":
          description: 摄取候选已原子提交
          content: {application/json: {schema: {$ref: "#/components/schemas/PlanIngestionCommitResult"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
        "500": {$ref: "#/components/responses/Internal"}

  /shoot-plans/{id}/assets:
    get:
      tags: [planning-media]
      operationId: listShootPlanAssets
      summary: 列出策划参考素材
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: cursor
          in: query
          schema: {type: string}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 40}
      responses:
        "200":
          description: 素材列表
          content: {application/json: {schema: {$ref: "#/components/schemas/PlanAssetPage"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/Internal"}
    post:
      tags: [planning-media]
      operationId: uploadShootPlanAsset
      summary: 上传策划参考素材
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/PlanningMediaUploadForm"}
      responses:
        "201":
          description: 素材已上传
          content: {application/json: {schema: {$ref: "#/components/schemas/UploadPlanAssetResult"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /shoot-plans/{id}/assets/{assetId}/bindings:
    post:
      tags: [planning-media]
      operationId: createShootPlanAssetBinding
      summary: 绑定参考素材到策划或镜头
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: assetId
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/CreateAssetBindingInput"}}}
      responses:
        "200":
          description: 绑定结果
          content: {application/json: {schema: {$ref: "#/components/schemas/AssetBindingResult"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /shoot-plans/{id}/assets/{assetId}/bindings/{bindingId}:
    delete:
      tags: [planning-media]
      operationId: releaseShootPlanAssetBinding
      summary: 释放参考素材绑定
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: assetId
          in: path
          required: true
          schema: {type: string}
        - name: bindingId
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReleaseAssetBindingInput"}}}
      responses:
        "200":
          description: 释放结果
          content: {application/json: {schema: {$ref: "#/components/schemas/AssetBindingResult"}}}
        "400": {$ref: "#/components/responses/ValidationFailed"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/Internal"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /shoot-plans/{id}/assets/{assetId}/content:
    get:
      tags: [planning-media]
      operationId: getShootPlanAssetContent
      summary: 读取展示版本参考素材
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: assetId
          in: path
          required: true
          schema: {type: string}
        - name: v
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 展示版本图片
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string}}
            Content-Length: {schema: {type: integer, format: int64}}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AvatarIfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前 avatar_revision 的 quoted token，例如 "ar-3"
      schema:
        type: string
        pattern: '^"ar-(0|[1-9][0-9]*)"$'
    ProfileIfMatch:
      name: If-Match
      in: header
      required: true
      description: 当前 AccountProfile.profile_revision 的 quoted token，例如 "pr-3"
      schema:
        type: string
        pattern: '^"pr-(0|[1-9][0-9]*)"$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 可选安全重放键；组合流程及从档期跳转的历史订单补录必须传。只持久化成功 2xx；24 小时内同账号、同操作、同 key、同规范化请求返回首次成功结果；成功绑定后的同 key 异请求返回 409 idempotency_conflict；客户端收到任意 5xx 时必须用原 body/key 重放确认，不得换 key
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 拍摄策划 mutation 的安全重放键；只持久化成功 2xx，24 小时内精确 frame 重放首次结果
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1

  responses:
    ValidationFailed:
      description: 400 validation_failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 401 unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 403 forbidden（Origin 缺失或与 PUBLIC_BASE_URL 不一致）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidOrExpiredToken:
      description: 400 invalid_or_expired_token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 429 rate_limited
      headers:
        Retry-After:
          schema:
            type: integer
          description: 固定秒数；不暴露 limiter 维度
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RegistrationDisabled:
      description: 503 registration_disabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 404 not_found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Internal:
      description: 500 internal
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 409 typed conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    PayloadTooLarge:
      description: 413 payload_too_large
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    UnsupportedMediaType:
      description: 415 unsupported_media_type
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    ServiceUnavailable:
      description: 503 asset_corrupt
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    PlanningMediaSourceClass:
      type: string
      enum: [official, anime_screenshot, setting_book, fan, unknown_web, photographer_owned, licensed, customer_supplied]
    PlanningMediaRightsBasis:
      type: string
      enum: [citation_or_display, ownership_attested, license_recorded, display_consent]
    PlanningMediaPurpose:
      type: string
      enum: [moodboard_display, shot_reference_display, generation_reference]
    PlanningMediaRightsDeclaration:
      type: object
      additionalProperties: false
      required: [source_class, rights_basis, license_generation_reference_granted]
      properties:
        source_class: {$ref: "#/components/schemas/PlanningMediaSourceClass"}
        rights_basis: {$ref: "#/components/schemas/PlanningMediaRightsBasis"}
        evidence_summary: {type: string, maxLength: 500}
        license_generation_reference_granted: {type: boolean}
    PlanningMediaUploadForm:
      type: object
      additionalProperties: false
      required: [image, rights, expected_plan_revision, intended_purpose, declared_media_type]
      properties:
        image: {type: string, format: binary}
        rights:
          type: string
          description: PlanningMediaRightsDeclaration 的严格 JSON 字符串
        expected_plan_revision: {type: integer, format: int64, minimum: 1}
        intended_purpose: {$ref: "#/components/schemas/PlanningMediaPurpose"}
        declared_media_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
    PlanAsset:
      type: object
      additionalProperties: false
      required: [id, upload_context_plan_id, display_name, state, current_generation, revision, gc_rule_version, created_at, updated_at, rights, active_bindings]
      properties:
        id: {type: string}
        upload_context_plan_id: {type: string}
        display_name: {type: string}
        display_checksum: {type: string}
        state: {type: string, enum: [staged, active, gc_pending, deleted, corrupt]}
        current_generation: {type: integer}
        revision: {type: integer, format: int64}
        gc_eligible_at: {type: string, format: date-time}
        gc_rule_version: {type: integer, enum: [1]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        rights:
          $ref: "#/components/schemas/PlanAssetRightsSnapshot"
        active_bindings:
          type: array
          items:
            $ref: "#/components/schemas/AssetBinding"

    PlanAssetRightsSnapshot:
      type: object
      additionalProperties: false
      required: [generation, source_class, rights_basis, license_generation_reference_granted, declared_at]
      description: 当前代的权利声明快照；矩阵裁决口径见 planningmedia/matrix.go。
      properties:
        generation: {type: integer}
        source_class: {$ref: "#/components/schemas/PlanningMediaSourceClass"}
        rights_basis: {$ref: "#/components/schemas/PlanningMediaRightsBasis"}
        license_generation_reference_granted: {type: boolean}
        declared_at: {type: string, format: date-time}
    PlanAssetAccessRef:
      type: object
      additionalProperties: false
      required: [asset_id, generation, display_checksum, display_name]
      properties:
        asset_id: {type: string}
        generation: {type: integer, minimum: 1}
        display_checksum: {type: string}
        display_name: {type: string}
    PlanAssetRendition:
      type: object
      additionalProperties: false
      required: [asset_id, generation, kind, media_type, byte_size, width, height, checksum]
      properties:
        asset_id: {type: string}
        generation: {type: integer}
        kind: {type: string, enum: [original, display]}
        media_type: {type: string}
        byte_size: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
        checksum: {type: string}
    PlanAssetGeneration:
      type: object
      additionalProperties: false
      required: [asset_id, generation, rights, original_checksum, display_checksum, created_at]
      properties:
        asset_id: {type: string}
        generation: {type: integer, minimum: 1}
        rights: {$ref: "#/components/schemas/PlanAssetRightsDeclaration"}
        original_checksum: {type: string}
        display_checksum: {type: string}
        created_at: {type: string, format: date-time}
    PlanAssetRightsDeclaration:
      type: object
      additionalProperties: false
      required: [id, asset_id, generation, source_class, rights_basis, license_generation_reference_granted, matrix_version, declared_at]
      properties:
        id: {type: string}
        asset_id: {type: string}
        generation: {type: integer, minimum: 1}
        source_class: {$ref: "#/components/schemas/PlanningMediaSourceClass"}
        rights_basis: {$ref: "#/components/schemas/PlanningMediaRightsBasis"}
        evidence_summary: {type: string, maxLength: 500}
        license_generation_reference_granted: {type: boolean}
        matrix_version: {type: integer, enum: [1]}
        declared_at: {type: string, format: date-time}
    UploadPlanAssetResult:
      type: object
      additionalProperties: false
      required: [asset, generation, access_ref, staged_until, original, display]
      properties:
        asset: {$ref: "#/components/schemas/PlanAsset"}
        generation: {$ref: "#/components/schemas/PlanAssetGeneration"}
        access_ref: {$ref: "#/components/schemas/PlanAssetAccessRef"}
        staged_until: {type: string, format: date-time}
        original: {$ref: "#/components/schemas/PlanAssetRendition"}
        display: {$ref: "#/components/schemas/PlanAssetRendition"}
    PlanAssetPage:
      type: object
      additionalProperties: false
      required: [items, done]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/PlanAsset"}}
        next_cursor: {type: string}
        done: {type: boolean}
    CreateAssetBindingInput:
      type: object
      additionalProperties: false
      required: [generation, holder_kind, holder_id, purpose, expected_plan_revision, expected_asset_revision]
      properties:
        generation: {type: integer, minimum: 1}
        holder_kind: {type: string, enum: [plan, shot]}
        holder_id: {type: string}
        purpose: {$ref: "#/components/schemas/PlanningMediaPurpose"}
        expected_plan_revision: {type: integer, format: int64, minimum: 1}
        expected_asset_revision: {type: integer, format: int64, minimum: 1}
    ReleaseAssetBindingInput:
      type: object
      additionalProperties: false
      required: [expected_plan_revision, expected_asset_revision, expected_binding_revision]
      properties:
        expected_plan_revision: {type: integer, format: int64, minimum: 1}
        expected_asset_revision: {type: integer, format: int64, minimum: 1}
        expected_binding_revision: {type: integer, format: int64, minimum: 1}
    AssetBinding:
      type: object
      additionalProperties: false
      required: [id, asset_id, generation, holder_kind, holder_id, plan_id, purpose, state, revision, created_at]
      properties:
        id: {type: string}
        asset_id: {type: string}
        generation: {type: integer}
        holder_kind: {type: string, enum: [plan, shot]}
        holder_id: {type: string}
        plan_id: {type: string}
        purpose: {$ref: "#/components/schemas/PlanningMediaPurpose"}
        state: {type: string, enum: [active, released]}
        revision: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        released_at: {type: string, format: date-time}
    AssetBindingResult:
      type: object
      additionalProperties: false
      required: [asset, binding]
      properties:
        asset: {$ref: "#/components/schemas/PlanAsset"}
        binding: {$ref: "#/components/schemas/AssetBinding"}
    AuthCapabilities:
      type: object
      additionalProperties: false
      required: [public_registration_enabled]
      properties:
        public_registration_enabled:
          type: boolean

    VerificationDispatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [verification_required]

    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          enum: [600]

    ErrorEnvelope:
      description: 统一错误封套；含认证错误码与既有业务 conflict 子码
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              $ref: "#/components/schemas/ErrorDetails"

    ErrorDetails:
      oneOf:
        - $ref: "#/components/schemas/ScheduleConflictDetails"
        - $ref: "#/components/schemas/ArchiveAcknowledgementRequiredDetails"
        - $ref: "#/components/schemas/ExpiryQuoteExpiredDetails"
        - $ref: "#/components/schemas/BusinessDraftUnavailableDetails"
        - $ref: "#/components/schemas/StaleBusinessDraftDetails"

    OrderBusinessDraftUnavailableReason:
      type: string
      enum:
        [order_required, order_cancelled, business_calculation_overflow]

    ScheduleBusinessDraftUnavailableReason:
      type: string
      enum:
        [order_required, duration_unknown, duration_not_positive,
         duration_out_of_range, schedule_stage_ineligible, schedule_slot_not_future]

    UnavailableOrderBusinessDraftItem:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [unavailable]
        reason:
          $ref: "#/components/schemas/OrderBusinessDraftUnavailableReason"

    UnavailableScheduleBusinessDraftItem:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state:
          type: string
          enum: [unavailable]
        reason:
          $ref: "#/components/schemas/ScheduleBusinessDraftUnavailableReason"

    BusinessDraftUnavailableDetails:
      type: object
      additionalProperties: false
      properties:
        order_adjustment:
          $ref: "#/components/schemas/UnavailableOrderBusinessDraftItem"
        schedule_duration:
          $ref: "#/components/schemas/UnavailableScheduleBusinessDraftItem"

    StaleBusinessDraftDetails:
      type: object
      additionalProperties: false
      required: [draft_id, kind, status, stale_reason, revision]
      properties:
        draft_id: {type: string}
        kind: {type: string, enum: [order_adjustment, schedule_duration]}
        status: {type: string, enum: [stale]}
        stale_reason:
          type: string
          enum:
            [superseded, expired, plan_revision_changed,
             business_facts_revision_changed, crm_connection_changed,
             crm_projection_changed, rule_version_changed,
             order_target_missing, order_stage_ineligible, order_target_changed,
             slot_target_missing, schedule_stage_ineligible, slot_target_changed]
        revision: {type: integer, format: int64, minimum: 1}

    ExpiryQuoteExpiredDetails:
      type: object
      additionalProperties: false
      required: [refreshed_expiry_policy]
      properties:
        refreshed_expiry_policy:
          $ref: "#/components/schemas/ExpiryPolicyProjectionV1"

    ArchiveAcknowledgementRequiredDetails:
      type: object
      additionalProperties: false
      required: [required_archive_acknowledgement]
      properties:
        required_archive_acknowledgement:
          $ref: "#/components/schemas/ArchiveAcknowledgement"

    ScheduleConflictDetails:
      description: order_in_use / order_already_scheduled 的可行动上下文；出现时两个字段必返
      type: object
      required: [schedule_slot_id, schedule_start_at]
      properties:
        schedule_slot_id:
          type: string
        schedule_start_at:
          type: string
          format: date-time

    Account:
      description: 账号（摄影师）；永不含 password_hash
      type: object
      required: [id, email, created_at, timezone]
      properties:
        id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          readOnly: true
        timezone:
          type: string
          description: IANA 时区；Settings 未落地前返回 Asia/Shanghai，日历不得使用浏览器时区替代

    Birthday:
      description: 生日特例："MM-DD" 或 "YYYY-MM-DD"（年份可缺，§4.1）
      type: string
      pattern: "^([0-9]{4}-)?[0-9]{2}-[0-9]{2}$"

    CustomerChannel:
      type: string
      enum: [xiaohongshu, douyin, weibo, referral, other]
      x-enum-varnames:
        - CustomerChannelXiaohongshu
        - CustomerChannelDouyin
        - CustomerChannelWeibo
        - CustomerChannelReferral
        - CustomerChannelOther

    CustomerStatus:
      type: string
      enum: [active, merged, archived]

    AvatarRevision:
      type: string
      readOnly: true
      pattern: "^ar-(0|[1-9][0-9]*)$"
      example: ar-0

    AvatarVersion:
      type: string
      readOnly: true
      pattern: "^sha256-[0-9a-f]{64}$"

    SocialPlatform:
      type: string
      enum: [wechat, qq, telegram, xiaohongshu, douyin, weibo, other]
      x-enum-varnames:
        - SocialPlatformWechat
        - SocialPlatformQq
        - SocialPlatformTelegram
        - SocialPlatformXiaohongshu
        - SocialPlatformDouyin
        - SocialPlatformWeibo
        - SocialPlatformOther

    ShootType:
      type: string
      enum: [portrait, cosplay, other]
      x-enum-varnames:
        - ShootTypePortrait
        - ShootTypeCosplay
        - ShootTypeOther

    PricingMode:
      type: string
      enum: [per_duration, per_photo, fixed]
      x-enum-varnames:
        - PricingModePerDuration
        - PricingModePerPhoto
        - PricingModeFixed

    PackageStatus:
      type: string
      enum: [active, archived]
      x-enum-varnames:
        - PackageStatusActive
        - PackageStatusArchived

    OrderStatus:
      description: 语义与合法跃迁见 §4.2 订单状态机
      type: string
      enum: [consulting, scheduled, shot, selected, retouching, delivered, closed, cancelled]

    OrderCreationMode:
      type: string
      enum: [new, backfill]

    SlotType:
      type: string
      enum: [shoot, hold, busy]

    ReminderType:
      type: string
      enum: [birthday, follow_up, churn, custom, plan_assignment_checklist]

    ReminderStatus:
      type: string
      enum: [pending, done, dismissed]

    Customer:
      type: object
      required: [id, account_id, created_at, display_name, channel, status, avatar_revision]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
        real_name:
          type: string
        phone:
          type: string
        birthday:
          $ref: "#/components/schemas/Birthday"
        channel:
          $ref: "#/components/schemas/CustomerChannel"
        referrer_customer_id:
          type: string
          description: channel=referral 时必填
        status:
          $ref: "#/components/schemas/CustomerStatus"
        merged_into_customer_id:
          type: string
          readOnly: true
        avatar_revision:
          $ref: "#/components/schemas/AvatarRevision"
        avatar_version:
          $ref: "#/components/schemas/AvatarVersion"
        avatar_url:
          type: string
          readOnly: true
          description: 仅当前有头像时存在；同源鉴权相对 URL，v 等于 avatar_version

    CustomerListItem:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [orders_count, last_shot_at]
          properties:
            orders_count:
              type: integer
              description: 非 cancelled 订单计数；order 域未落地前恒为 0
            last_shot_at:
              type: string
              format: date
              nullable: true
              description: 非 cancelled 订单 max(shot_at) 按账号时区截断；order 域未落地前恒为 null
            planning_summary:
              $ref: "#/components/schemas/PlanningSummary"

    CustomerSummary:
      type: object
      required: [id, display_name, channel, status, avatar_revision]
      properties:
        id:
          type: string
        display_name:
          type: string
        channel:
          $ref: "#/components/schemas/CustomerChannel"
        status:
          $ref: "#/components/schemas/CustomerStatus"
        avatar_revision:
          $ref: "#/components/schemas/AvatarRevision"
        avatar_version:
          $ref: "#/components/schemas/AvatarVersion"
        avatar_url:
          type: string
          readOnly: true

    CustomerStats:
      type: object
      required: [orders_count, total_order_amount, last_shot_at]
      properties:
        orders_count:
          type: integer
          description: 非 cancelled 订单计数；order 域未落地前恒为 0
        total_order_amount:
          type: integer
          description: 分；非 cancelled 订单 price 之和；order 域未落地前恒为 0
        last_shot_at:
          type: string
          format: date
          nullable: true
          description: 口径同 CustomerListItem.last_shot_at

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          required: [identities, notes, referrer, stats]
          properties:
            identities:
              type: array
              items:
                $ref: "#/components/schemas/SocialIdentity"
            notes:
              description: 倒序
              type: array
              items:
                $ref: "#/components/schemas/CustomerNote"
            referrer:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CustomerSummary"
            stats:
              $ref: "#/components/schemas/CustomerStats"
            planning_summary:
              $ref: "#/components/schemas/PlanningSummary"

    SocialIdentity:
      type: object
      required: [id, account_id, created_at, customer_id, platform, handle]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        platform:
          $ref: "#/components/schemas/SocialPlatform"
        handle:
          type: string
        remark:
          type: string

    CustomerNote:
      type: object
      required: [id, account_id, created_at, customer_id, content]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        content:
          type: string
          maxLength: 500

    PackageInput:
      type: object
      required: [name, shoot_type, pricing_mode, base_price]
      properties:
        name:
          type: string
        shoot_type:
          $ref: "#/components/schemas/ShootType"
        pricing_mode:
          $ref: "#/components/schemas/PricingMode"
        base_price:
          type: integer
          description: 分
        duration_minutes:
          type: integer
        shot_count_min:
          type: integer
        shot_count_max:
          type: integer
        raw_delivery_count:
          type: integer
        retouch_count:
          type: integer
          description: 0=不含精修
        note:
          type: string
          maxLength: 500

    Package:
      allOf:
        - $ref: "#/components/schemas/PackageInput"
        - type: object
          required: [id, account_id, created_at, status]
          properties:
            id:
              type: string
              readOnly: true
            account_id:
              type: string
              readOnly: true
              description: 服务端由账号上下文写入，客户端永不传（ADR-001）
            created_at:
              type: string
              format: date-time
              readOnly: true
            status:
              $ref: "#/components/schemas/PackageStatus"

    PackageListItem:
      allOf:
        - $ref: "#/components/schemas/Package"
        - type: object
          required: [orders_count]
          properties:
            orders_count:
              type: integer
              description: 引用本套系的非 cancelled 订单计数；order 域未落地前恒为 0

    Order:
      type: object
      required: [id, account_id, created_at, customer_id, status, deposit_paid, balance_paid, amount_paid, channel_snapshot]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        customer_id:
          type: string
        package_id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        price:
          type: integer
          description: 分
        deposit_paid:
          type: boolean
          default: false
        balance_paid:
          type: boolean
          default: false
        amount_paid:
          type: integer
          description: 分；已收现金，恒有值（默认 0）。未显式给 outstanding_amount 时按 DEC-10 推定（§4.2 支付事实语义）
        outstanding_amount:
          type: integer
          description: 分；待收余额。NULL=price 未定价、不计入待收合计；balance_paid=true 时恒为 0（单向不变量）
        paid_at:
          type: string
          format: date-time
          description: 收款时刻；仅在 balance_paid 由 false 实际跃迁为 true 且未显式提供时自动写服务端 now，创建不自动写（§4.2）
        channel_snapshot:
          allOf:
            - $ref: "#/components/schemas/CustomerChannel"
          description: 下单时固化的客户渠道归因快照（dashboard-v2 ITEM-3）。此后不可变：客户渠道后改、merge 改挂、任何 PATCH 都不重算；非请求字段。取值域与 customers.channel 同步（§4.2）
        shoot_type_snapshot:
          allOf:
            - $ref: "#/components/schemas/ShootType"
          description: 下单时固化的套系拍摄类型快照（dashboard-v2 ITEM-3）；NULL=无套系订单，渠道×类型矩阵归「未归因」桶。不可变，非请求字段（§4.2）
        shot_at:
          type: string
          format: date-time
          description: 进入 shot 时服务端自动写入，事后可 PATCH 修正（§4.2）
        delivered_at:
          type: string
          format: date-time
          description: 进入 delivered 时服务端自动写入，事后可 PATCH 修正（§4.2）
        note:
          type: string
        delivery_due_at:
          type: string
          format: date
          description: 应交付日（date-only）。缺省时由服务端在 shot_at 首次落值或变更时按账号时区 + Settings.delivery_sla_days 自动派生；其余写路径不重算既有值。显式给值即订单级覆盖，此后不随 shot_at 变更重算；仅已到达拍摄且未取消的订单接受该字段（§4.2）
        delivery_due_is_override:
          type: boolean
          default: false
          description: true 表示该应交付日是订单级覆盖，不随 shot_at 变更重算（§4.2）

    OrderListItem:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [customer_display_name]
          properties:
            customer_display_name:
              type: string
              description: 引用客户的 display_name（列表可读性摘要，§4.3 2026-07-09 update）
            package_name:
              type: string
              description: 引用套系的 name；未引用套系时缺省
            planning_summary:
              $ref: "#/components/schemas/PlanningSummary"

    ScheduleSlot:
      type: object
      required: [id, account_id, created_at, start_at, end_at, type]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 必须 > start_at
        type:
          $ref: "#/components/schemas/SlotType"
        order_id:
          type: string
          description: type=shoot 时必填；同一订单最多关联一条 shoot slot
        note:
          type: string
          maxLength: 500

    ScheduleSlotListItemBase:
      type: object
      required: [id, account_id, created_at, start_at, end_at]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          description: 必须 > start_at
        note:
          type: string
          maxLength: 500

    ShootScheduleSlotListItem:
      allOf:
        - $ref: "#/components/schemas/ScheduleSlotListItemBase"
        - type: object
          required:
            [type, order_id, customer_id, customer_display_name, customer_status,
             order_status, order_deposit_paid, order_balance_paid]
          properties:
            type:
              type: string
              enum: [shoot]
            order_id:
              type: string
              description: shoot slot 必返的关联订单 id
            customer_id:
              type: string
              description: 引用订单的当前客户 id；merge 后返回 target id，供恢复流程与客户档案订单 tab 使用
            customer_display_name:
              type: string
              description: 引用订单的当前客户名
            customer_status:
              allOf:
                - $ref: "#/components/schemas/CustomerStatus"
              description: 当前客户状态；客户归档后仍返回，供文本警示
            order_title:
              type: string
              description: 引用订单的标题；无标题时缺省，由前端按套系/客户兜底
            package_name:
              type: string
              description: 引用订单所选套系名；未选套系时缺省
            order_status:
              $ref: "#/components/schemas/OrderStatus"
            order_price:
              type: integer
              description: 订单价格，单位为分；订单未设置价格时缺省
            order_deposit_paid:
              type: boolean
              description: 订单定金是否已收
            order_balance_paid:
              type: boolean
              description: 订单尾款是否已收
            package_shoot_type:
              allOf:
                - $ref: "#/components/schemas/ShootType"
              description: 订单所选套系的拍摄类型；未选套系时缺省
            planning_summary:
              $ref: "#/components/schemas/PlanningSummary"

    NonShootScheduleSlotListItem:
      allOf:
        - $ref: "#/components/schemas/ScheduleSlotListItemBase"
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [hold, busy]
              description: hold/busy 不带订单或客户引用摘要

    ScheduleSlotListItem:
      oneOf:
        - $ref: "#/components/schemas/ShootScheduleSlotListItem"
        - $ref: "#/components/schemas/NonShootScheduleSlotListItem"
      discriminator:
        propertyName: type
        mapping:
          shoot: "#/components/schemas/ShootScheduleSlotListItem"
          hold: "#/components/schemas/NonShootScheduleSlotListItem"
          busy: "#/components/schemas/NonShootScheduleSlotListItem"

    Reminder:
      type: object
      required: [id, account_id, created_at, type, due_date, content, status, dedup_key]
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
          readOnly: true
          description: 服务端由账号上下文写入，客户端永不传（ADR-001）
        created_at:
          type: string
          format: date-time
          readOnly: true
        type:
          $ref: "#/components/schemas/ReminderType"
        customer_id:
          type: string
        order_id:
          type: string
        plan_id:
          type: string
          readOnly: true
          description: plan_assignment_checklist 只读引用；legacy 类型不返回
        due_date:
          type: string
          format: date
        content:
          type: string
        status:
          $ref: "#/components/schemas/ReminderStatus"
        dedup_key:
          type: string
          description: unique per account（规则见 §4.4）

    PlanAssignmentReminderRecipientKind:
      type: string
      enum: [account_owner]
      description: 收件人固定为摄影师账号所有者；永不向客户投递

    PlanAssignmentReminderDeliveryMode:
      type: string
      enum: [in_app, telegram_digest_if_bound]
      description: 站内提醒；若账号已绑定 Telegram 则进入 digest

    PlanAssignmentReminderGroup:
      type: object
      additionalProperties: false
      required:
        [
          group_id,
          reminder_id,
          reminder_status,
          due_date,
          item_count,
          slot_id,
          content,
          recipient_kind,
          delivery_modes,
        ]
      properties:
        group_id:
          type: string
        reminder_id:
          type: string
        reminder_status:
          $ref: "#/components/schemas/ReminderStatus"
        due_date:
          type: string
          format: date
          description: 账号本地日期 due；current group 必有
        item_count:
          type: integer
          minimum: 0
        slot_id:
          type: string
        content:
          type: string
          description: 确定性长文案摘要（认领项核对（N项）：前3项…）
        recipient_kind:
          $ref: "#/components/schemas/PlanAssignmentReminderRecipientKind"
        delivery_modes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/PlanAssignmentReminderDeliveryMode"

    PlanAssignmentReminderView:
      type: object
      additionalProperties: false
      required: [plan_id, unscheduled_source_count, groups]
      properties:
        plan_id:
          type: string
          readOnly: true
        unscheduled_source_count:
          type: integer
          minimum: 0
          description: 有 active readiness 但尚无 future shoot slot 的 source 数；不从 Reminder 文案反解析
        groups:
          type: array
          description: 仅 state=current 的 groups；历史保留在 Reminder 列表与内部 projection
          items:
            $ref: "#/components/schemas/PlanAssignmentReminderGroup"

    ChurnThreshold:
      type: object
      required: [shoot_type, days]
      properties:
        shoot_type:
          $ref: "#/components/schemas/ShootType"
        days:
          type: integer

    ScheduleAvailabilityWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 账号时区的本地开始时间，HH:MM
        end:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: 账号时区的本地结束时间，HH:MM；必须晚于 start

    ScheduleAvailabilityWeekly:
      type: object
      additionalProperties: false
      required: ["1", "2", "3", "4", "5", "6", "7"]
      properties:
        "1":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "2":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "3":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "4":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "5":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "6":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"
        "7":
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleAvailabilityWindow"

    ScheduleAvailability:
      type: object
      additionalProperties: false
      required: [weekly, min_opening_minutes, turnaround_minutes]
      properties:
        weekly:
          $ref: "#/components/schemas/ScheduleAvailabilityWeekly"
        min_opening_minutes:
          type: integer
          minimum: 15
          maximum: 480
        turnaround_minutes:
          type: integer
          minimum: 0
          maximum: 240

    Settings:
      type: object
      additionalProperties: false
      required:
        [timezone, birthday_lead_days, follow_up_after_days, churn_thresholds,
         digest_hour, delivery_sla_days, availability, planning_business_rule_overrides,
         planning_business_rule_revision]
      properties:
        timezone:
          type: string
          description: IANA，默认 Asia/Shanghai；所有 date-only 判定按此时区（§4.1）
        birthday_lead_days:
          type: integer
          default: 3
        follow_up_after_days:
          type: integer
          default: 7
        churn_thresholds:
          type: array
          items:
            $ref: "#/components/schemas/ChurnThreshold"
          description: 默认全类型 180
        digest_hour:
          type: integer
          minimum: 0
          maximum: 23
          default: 9
          description: 按 timezone
        delivery_sla_days:
          type: integer
          minimum: 1
