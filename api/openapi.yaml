                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PackageListItem"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /packages/{id}:
    patch:
      tags: [packages]
      operationId: updatePackage
      summary: 更新套系；归档 = PATCH {status:archived}（无 in-use 校验，§4.3）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                shoot_type:
                  $ref: "#/components/schemas/ShootType"
                pricing_mode:
                  $ref: "#/components/schemas/PricingMode"
                base_price:
                  type: integer
                  description: 分
                duration_minutes:
                  type: integer
                  nullable: true
                shot_count_min:
                  type: integer
                  nullable: true
                shot_count_max:
                  type: integer
                  nullable: true
                raw_delivery_count:
                  type: integer
                  nullable: true
                retouch_count:
                  type: integer
                  nullable: true
                  description: 0=不含精修
                note:
                  type: string
                  maxLength: 500
                status:
                  $ref: "#/components/schemas/PackageStatus"
      responses:
