        "200":
          description: 更新后的提醒
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /admin/reminders/scan:
    post:
      tags: [reminders, reminder-engine]
      operationId: scanReminders
      summary: 提醒扫描唯一手动触发入口（每日定时与手动共用，鉴权同 §4.1）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  description: 缺省=账号时区今日
      responses:
        "200":
          description: 扫描结果计数
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped, auto_dismissed]
                properties:
                  created:
                    type: integer
                  skipped:
                    type: integer
                  auto_dismissed:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /settings:
    get:
      tags: [settings, reminder-engine]
      operationId: getSettings
      summary: 读取设置
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
