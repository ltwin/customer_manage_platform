            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: 新建订单（creation_mode=new 为新业务，backfill 为历史补录）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                creation_mode:
                  allOf:
                    - $ref: "#/components/schemas/OrderCreationMode"
                  default: new
                  description: new=新业务，只允许 consulting/scheduled 且只能引用 active 客户/套系；backfill=历史补录，可按状态不变量直达并允许 active/archived 客户与套系，merged 客户仍拒绝
                customer_id:
                  type: string
                package_id:
                  type: string
                title:
                  type: string
                price:
                  type: integer
                  description: 分
                status:
                  allOf:
                    - $ref: "#/components/schemas/OrderStatus"
                  description: creation_mode=new 时缺省 consulting 且仅允许 consulting/scheduled；backfill 时可直达八态，≥shot 须显式 shot_at、≥delivered（含 closed）须显式 delivered_at，closed 须 balance_paid=true
                deposit_paid:
                  type: boolean
                  default: false
                balance_paid:
                  type: boolean
                  default: false
                shot_at:
                  type: string
                  format: date-time
                  description: 补录用；仅目标状态已到达 shot 时可给
                delivered_at:
                  type: string
                  format: date-time
                  description: 补录用；仅目标状态已到达 delivered 时可给
                note:
                  type: string
                delivery_due_at:
                  type: string
                  format: date
                  description: 应交付日（date-only）。缺省时由服务端在 shot_at 首次落值或变更时按账号时区 + Settings.delivery_sla_days 自动派生；其余写路径不重算既有值。显式给值即订单级覆盖，此后不随 shot_at 变更重算；仅已到达拍摄且未取消的订单接受该字段。建单无「撤销覆盖」语义，故不接受 null——缺省即走自动派生；撤销覆盖见 PATCH（§4.2）
                amount_paid:
                  type: integer
                  description: 分；已收现金。未显式给 outstanding_amount 时按 §4.2 DEC-10 推定——结清单（balance_paid=true）推定结清金额（不降低既有），未结清单推定 max(price−amount_paid, 0)。不接受 null
                outstanding_amount:
                  type: integer
                  description: 分；待收余额，显式值优先于推定；price 未定价且未显式给值时为 null（不计入待收合计）。结清态显式非 0 → 400。不接受 null
                paid_at:
                  type: string
                  format: date-time
                  description: 收款时刻，补录历史收款用；缺省不自动写——创建不发明收款时刻（§4.2）。不接受 null
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: customer_archived（new 引用 merged/archived 客户，或 backfill 引用 merged 客户）| unpaid_balance（补录 status=closed 且 balance_paid≠true）| idempotency_conflict（已成功绑定的同 key 使用不同请求体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [orders]
      operationId: listOrders
      summary: 订单列表（默认排序 created_at DESC、同值 id DESC，保证分页稳定，§4.3）
      parameters:
        - name: id
          in: query
          description: 精确订单 id；仍按当前账号隔离，可与其他过滤条件组合
          schema:
            type: string
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: unpaid_balance
          in: query
          description: true = balance_paid=false 且 status ∈ {shot, selected, retouching, delivered}（已进入交付链条且未结清，§4.3 2026-07-09 口径）
          schema:
            type: boolean
        - name: schedulable_at
          in: query
          description: 目标 slot 的 end_at；服务端按它相对当前时刻应用与 POST/PATCH 相同的订单/客户未来历史矩阵并排除已有 shoot slot：未来要求客户 active，历史允许 active/archived，merged 永不允许；可与 customer_id 组合
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页订单列表
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderListItem"
                  total:
                    type: integer
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /orders/{id}:
    patch:
      tags: [orders]
      operationId: updateOrder
      summary: 状态跃迁与字段修正（状态机语义见 §4.2；status 等于当前状态时为 200 no-op）
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
                deposit_paid:
                  type: boolean
                balance_paid:
                  type: boolean
                shot_at:
                  type: string
                  format: date-time
                delivered_at:
                  type: string
                  format: date-time
                title:
                  type: string
                price:
                  type: integer
                  description: 分
                note:
                  type: string
                delivery_due_at:
                  type: string
                  format: date
                  nullable: true
                  description: 应交付日（date-only）。缺省时由服务端在 shot_at 首次落值或变更时按账号时区 + Settings.delivery_sla_days 自动派生；其余写路径不重算既有值。显式给值即订单级覆盖，此后不随 shot_at 变更重算；仅已到达拍摄且未取消的订单接受该字段。显式传 null 撤销订单级覆盖并按当前 shot_at 重新派生（无 shot_at 时清空）；未传该字段保持现状（§4.2）
                amount_paid:
                  type: integer
                  description: 分；已收现金。录入/修正后未显式给 outstanding_amount 时按 §4.2 DEC-10 推定 max(price−amount_paid, 0)。金额字段无 null 语义，显式 null → 400
                outstanding_amount:
                  type: integer
                  description: 分；待收余额，显式值优先于推定。balance_paid=true 时显式非 0 → 400（单向不变量）。无 null 语义，显式 null → 400
                paid_at:
                  type: string
                  format: date-time
                  description: 收款时刻，可补录修正；标记收讫（balance_paid false→true）且未显式提供时自动写服务端 now。无 null 语义，显式 null → 400（§4.2）
      responses:
        "200":
          description: 更新后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: invalid_status_transition（非法跃迁）| unpaid_balance（未结清进 closed / closed 订单试图取消结清标记，字段修正不变量见 §4.2）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [orders]
      operationId: deleteOrder
      summary: 物理删除终态订单（closed/cancelled，§4.3 2026-07-09）
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: 已删除，无响应体；实时聚合/统计即时反映（删 closed 单会减少 orders_count 与营收类统计）
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_not_terminal（非终态订单不可删除，先 cancel）| order_in_use（被 type=shoot 的 slot 引用；details 必返 schedule_slot_id/schedule_start_at）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /schedule/slots:
    get:
      tags: [schedule]
      operationId: listScheduleSlots
      summary: 档期区间查询（含跨界 slot）
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 半开区间 [from,to) 的 UTC 起点；月历传完整 6 周可见网格的账号本地日界
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: 半开区间 [from,to) 的 UTC 终点
      responses:
        "200":
          description: 区间内档期
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSlotListItem"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [schedule]
      operationId: createScheduleSlot
      summary: 新建档期（支持跨日；重叠不阻止；同一订单最多一条 shoot slot）
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at, end_at, type]
              properties:
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                type:
                  $ref: "#/components/schemas/SlotType"
                order_id:
                  type: string
                  description: type=shoot 时必填；未来/进行中只允许 consulting/scheduled 且客户须 active；历史补录允许 scheduled/shot/selected/retouching/delivered/closed 且客户可 active/archived；cancelled 或 merged 客户永不允许
                note:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: 已创建（含重叠提示）
          content:
            application/json:
              schema:
                type: object
                required: [slot, overlaps]
                properties:
                  slot:
                    $ref: "#/components/schemas/ScheduleSlot"
                  overlaps:
                    type: array
                    items:
                      type: string
                    description: 与新 slot 重叠的 slot_id 列表
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_already_scheduled（订单已有 shoot slot，details 返回现有 slot）| customer_archived（未来档期的客户已归档/合并）| customer_changed（并发 merge 导致订单客户连续变化，需重拉候选）| idempotency_conflict（已成功绑定的同 key 使用不同请求体）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /schedule/slots/{id}:
    get:
      tags: [schedule]
      operationId: getScheduleSlot
      summary: 按账号范围读取单条档期及展示摘要；用于 slot 深链定位
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: 单条档期展示摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlotListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [schedule]
      operationId: updateScheduleSlot
      summary: 更新档期；时间/type/order 变化重验订单与客户矩阵，note-only 不重验外部状态
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                type:
                  $ref: "#/components/schemas/SlotType"
                order_id:
                  type: string
                  nullable: true
                  description: 显式 null 清空关联；省略表示不改
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: 显式 null 清空备注；省略表示不改
      responses:
        "200":
          description: 更新后的档期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSlot"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: order_already_scheduled（目标订单已有另一条 shoot slot，details 返回现有 slot）| customer_archived（未来档期的客户已归档/合并）| customer_changed（并发 merge 导致订单客户连续变化，需重拉候选）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
