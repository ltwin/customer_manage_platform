      responses:
        "200":
          description: 设置后的账号资料；same-content 完整对象重放为 no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: avatar_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [account-profile]
      operationId: deleteAccountProfileAvatar
      summary: 条件移除账号头像
      parameters:
        - $ref: "#/components/parameters/AvatarIfMatch"
      responses:
        "200":
          description: 移除后的账号资料；已无头像时为 no-op
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: avatar_revision_conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

  /account/profile/avatar/content:
    get:
      tags: [account-profile]
      operationId: getAccountProfileAvatarContent
      summary: 经账号鉴权读取当前强版本账号头像内容
      parameters:
        - name: v
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AvatarVersion"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            pattern: '^"sha256-[0-9a-f]{64}"$'
      responses:
        "200":
          description: 完整性已验证的当前头像字节
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            Vary:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: If-None-Match 命中当前完整对象
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: avatar_version_stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Internal"

